<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savannah Stride - Giraffe 3D Animation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #0c0a09;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    .glass {
      background: rgba(23, 20, 18, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .custom-range {
      accent-color: #f59e0b;
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden text-amber-50">

  <!-- 3D Viewport Canvas -->
  <div id="canvas-container" class="absolute inset-0 z-0"></div>

  <!-- Header Info Overlay -->
  <div class="absolute top-4 left-4 z-10 pointer-events-none">
    <div class="glass px-4 py-3 rounded-2xl shadow-xl flex items-center space-x-3 pointer-events-auto">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-yellow-400 flex items-center justify-center shadow-lg shadow-amber-500/20">
        <!-- Giraffe SVG Icon -->
        <svg class="w-6 h-6 text-stone-900" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 2a1 1 0 0 0-1 1v2.2L15.6 3a1 1 0 0 0-1.4 0l-1.5 1.5a1 1 0 0 0-.2.4L11 9H9a2 2 0 0 0-2 2v2H5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h1v1a1 1 0 0 0 2 0v-1h2v1a1 1 0 0 0 2 0v-1h1a2 2 0 0 0 2-2v-3.5l1.6-2.5A1 1 0 0 0 16 11V6.4l2.4 1.4A1 1 0 0 0 20 7V3a1 1 0 0 0-1-1z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-sm font-semibold tracking-wide text-amber-200 uppercase">Serengeti Plains</h1>
        <p class="text-xs text-amber-100/70">Articulated Giraffe Walk Cycle</p>
      </div>
    </div>
  </div>

  <!-- Interactive Controls Card -->
  <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-10 w-[92%] max-w-2xl pointer-events-auto">
    <div class="glass p-4 sm:p-5 rounded-3xl shadow-2xl flex flex-col gap-4">
      
      <!-- Top Row: Presets & Primary Controls -->
      <div class="flex flex-wrap items-center justify-between gap-3">
        <!-- Camera Mode Buttons -->
        <div class="flex items-center space-x-1.5 bg-black/40 p-1.5 rounded-2xl border border-white/5">
          <button id="cam-follow" class="cam-btn px-3 py-1.5 rounded-xl text-xs font-medium transition-all bg-amber-500 text-stone-950 font-semibold shadow">
            Cinematic
          </button>
          <button id="cam-side" class="cam-btn px-3 py-1.5 rounded-xl text-xs font-medium transition-all text-amber-200/80 hover:text-white hover:bg-white/10">
            Side Profile
          </button>
          <button id="cam-orbit" class="cam-btn px-3 py-1.5 rounded-xl text-xs font-medium transition-all text-amber-200/80 hover:text-white hover:bg-white/10">
            Free Orbit
          </button>
        </div>

        <!-- Time of Day Dropdown / Toggles -->
        <div class="flex items-center space-x-1.5 bg-black/40 p-1.5 rounded-2xl border border-white/5">
          <button id="tod-golden" title="Golden Hour" class="tod-btn px-2.5 py-1.5 rounded-xl text-xs flex items-center space-x-1 bg-amber-500/20 text-amber-300 border border-amber-500/40">
            <span>🌅 Golden</span>
          </button>
          <button id="tod-noon" title="High Noon" class="tod-btn px-2.5 py-1.5 rounded-xl text-xs flex items-center space-x-1 text-stone-300 hover:text-white hover:bg-white/10">
            <span>☀️ Noon</span>
          </button>
          <button id="tod-dusk" title="Sunset Dusk" class="tod-btn px-2.5 py-1.5 rounded-xl text-xs flex items-center space-x-1 text-stone-300 hover:text-white hover:bg-white/10">
            <span>🌇 Dusk</span>
          </button>
        </div>

        <!-- Play/Pause & Reset -->
        <div class="flex items-center space-x-2">
          <button id="btn-play" class="w-9 h-9 rounded-2xl bg-amber-500 text-stone-950 flex items-center justify-center hover:bg-amber-400 transition-colors shadow">
            <!-- Pause Icon (Default playing) -->
            <svg id="play-icon" class="w-4 h-4 fill-current" viewBox="0 0 24 24">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
          </button>
          <button id="btn-reset" title="Reset Camera View" class="w-9 h-9 rounded-2xl bg-white/10 text-amber-200 hover:bg-white/20 flex items-center justify-center transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Bottom Row: Speed Slider & Details -->
      <div class="flex items-center justify-between gap-4 pt-1 border-t border-white/10 text-xs">
        <div class="flex items-center space-x-3 w-full sm:w-auto flex-1">
          <span class="text-amber-200/70 whitespace-nowrap">Walk Pace:</span>
          <input id="slider-speed" type="range" min="0.3" max="2.2" step="0.1" value="1.0" class="custom-range w-full max-w-[180px] h-1.5 bg-black/40 rounded-lg cursor-pointer">
          <span id="speed-display" class="text-amber-300 font-mono w-10">1.0x</span>
        </div>

        <div class="hidden sm:flex items-center text-amber-200/60 text-[11px] space-x-3">
          <span>• Lateral Pacing Gait</span>
          <span>• Procedural Savannah</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Notification Banner -->
  <div id="toast" class="fixed top-6 right-6 z-20 glass px-4 py-2.5 rounded-2xl text-xs text-amber-200 border border-amber-500/30 opacity-0 transition-opacity duration-300 pointer-events-none">
    Camera Mode: Orbit Controls Enabled
  </div>

  <script>
    // --- Master Simulation & Scene Variables ---
    let scene, camera, renderer, controls;
    let giraffeGroup, dustSystem;
    let groundMesh, environmentProps = [];
    let sunLight, hemiLight, skyMesh;
    
    // Animation cycle state
    let isPlaying = true;
    let walkSpeed = 1.0;
    let walkCycle = 0;
    let worldSpeed = 4.2; // Forward translation speed
    let currentCamMode = 'follow'; // 'follow', 'side', 'orbit'
    let currentTOD = 'golden';

    // Model Bones / Hierarchy pointers
    const gParts = {};

    // -------------------------------------------------------------
    // Procedural Giraffe Fur Texture Generator
    // Generates classic Voronoi / Polygonal giraffe patches
    // -------------------------------------------------------------
    function createGiraffeTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Base coat: rich cream / warm ochre
      ctx.fillStyle = '#f3e5c8';
      ctx.fillRect(0, 0, 512, 512);

      // Create irregular polygonal patches using jittered grid cells
      const gridSize = 8;
      const step = 512 / gridSize;
      const points = [];

      for (let i = 0; i < gridSize; i++) {
        for (let j = 0; j < gridSize; j++) {
          points.push({
            x: (i + 0.2 + Math.random() * 0.6) * step,
            y: (j + 0.2 + Math.random() * 0.6) * step,
            size: step * (0.32 + Math.random() * 0.12),
            color: Math.random() > 0.4 ? '#682e0e' : '#7f3912' // alternating deep russet browns
          });
        }
      }

      // Draw rounded polygonal spots
      points.forEach(pt => {
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        const numSides = 5 + Math.floor(Math.random() * 3);
        const radius = pt.size;
        for (let a = 0; a < numSides; a++) {
          const angle = (a / numSides) * Math.PI * 2;
          const r = radius * (0.8 + Math.random() * 0.35);
          const px = Math.cos(angle) * r;
          const py = Math.sin(angle) * r;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });

      // Subtle fine fur noise
      const imgData = ctx.getImageData(0, 0, 512, 512);
      const data = imgData.data;
      for (let k = 0; k < data.length; k += 4) {
        const noise = (Math.random() - 0.5) * 14;
        data[k] += noise;
        data[k+1] += noise * 0.8;
        data[k+2] += noise * 0.6;
      }
      ctx.putImageData(imgData, 0, 0);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(2, 2);
      return texture;
    }

    // Common Materials
    let giraffeMaterial, darkHornMaterial, hoofMaterial;

    function initMaterials() {
      const giraffeTex = createGiraffeTexture();
      giraffeMaterial = new THREE.MeshStandardMaterial({
        map: giraffeTex,
        roughness: 0.75,
        metalness: 0.1,
        bumpScale: 0.02
      });

      darkHornMaterial = new THREE.MeshStandardMaterial({
        color: 0x271911,
        roughness: 0.9,
        metalness: 0.05
      });

      hoofMaterial = new THREE.MeshStandardMaterial({
        color: 0x1f1610,
        roughness: 0.8
      });
    }

    // -------------------------------------------------------------
    // Procedural 3D Giraffe Construction
    // -------------------------------------------------------------
    function buildGiraffe() {
      giraffeGroup = new THREE.Group();

      // 1. Main Root / Pelvis anchor
      const root = new THREE.Group();
      root.position.y = 3.6; // elevated torso height
      giraffeGroup.add(root);
      gParts.root = root;

      // 2. Torso (Deep sloped chest, slender belly, sloped spine)
      // Giraffe backs famously slope heavily from shoulders down to hips
      const bodyGroup = new THREE.Group();
      root.add(bodyGroup);
      gParts.body = bodyGroup;

      // Chest / Front body (larger & higher)
      const chestGeo = new THREE.BoxGeometry(1.3, 1.4, 1.8);
      // deform vertices to make it more organic/tapered
      const chestMesh = new THREE.Mesh(chestGeo, giraffeMaterial);
      chestMesh.position.set(0, 0.2, 0.7);
      chestMesh.rotation.x = -0.12;
      chestMesh.castShadow = true;
      bodyGroup.add(chestMesh);

      // Withers / Shoulder Hump
      const humpGeo = new THREE.ConeGeometry(0.7, 0.8, 5);
      const humpMesh = new THREE.Mesh(humpGeo, giraffeMaterial);
      humpMesh.position.set(0, 0.9, 0.9);
      humpMesh.rotation.x = -0.25;
      humpMesh.castShadow = true;
      bodyGroup.add(humpMesh);

      // Hindquarters / Rump (sloping down)
      const rumpGeo = new THREE.BoxGeometry(1.15, 1.1, 1.6);
      const rumpMesh = new THREE.Mesh(rumpGeo, giraffeMaterial);
      rumpMesh.position.set(0, -0.1, -0.7);
      rumpMesh.rotation.x = 0.1;
      rumpMesh.castShadow = true;
      bodyGroup.add(rumpMesh);

      // 3. Neck & Head Hierarchy
      // Base of neck attaches near the high shoulder
      const neckBase = new THREE.Group();
      neckBase.position.set(0, 0.75, 1.4);
      bodyGroup.add(neckBase);
      gParts.neckBase = neckBase;

      // Lower neck segment
      const neckLowerGeo = new THREE.CylinderGeometry(0.38, 0.58, 2.4, 8);
      const neckLowerMesh = new THREE.Mesh(neckLowerGeo, giraffeMaterial);
      neckLowerMesh.position.set(0, 1.15, 0.35);
      neckLowerMesh.rotation.x = 0.35; // angled forward
      neckLowerMesh.castShadow = true;
      neckBase.add(neckLowerMesh);

      // Mid-Upper Neck Pivot
      const neckMid = new THREE.Group();
      neckMid.position.set(0, 2.2, 0.75);
      neckBase.add(neckMid);
      gParts.neckMid = neckMid;

      const neckUpperGeo = new THREE.CylinderGeometry(0.28, 0.40, 2.4, 8);
      const neckUpperMesh = new THREE.Mesh(neckUpperGeo, giraffeMaterial);
      neckUpperMesh.position.set(0, 1.1, 0.25);
      neckUpperMesh.rotation.x = 0.25;
      neckUpperMesh.castShadow = true;
      neckMid.add(neckUpperMesh);

      // Mane running down the neck ridge
      const maneGeo = new THREE.BoxGeometry(0.1, 4.4, 0.25);
      const maneMat = new THREE.MeshStandardMaterial({ color: 0x421b0b, roughness: 0.9 });
      const maneMesh = new THREE.Mesh(maneGeo, maneMat);
      maneMesh.position.set(0, 1.6, -0.05);
      maneMesh.rotation.x = 0.3;
      neckBase.add(maneMesh);

      // 4. Head Group
      const headGroup = new THREE.Group();
      headGroup.position.set(0, 2.3, 0.5);
      neckMid.add(headGroup);
      gParts.head = headGroup;

      // Cranium
      const craniumGeo = new THREE.BoxGeometry(0.55, 0.55, 0.7);
      const craniumMesh = new THREE.Mesh(craniumGeo, giraffeMaterial);
      craniumMesh.position.set(0, 0.1, 0.1);
      craniumMesh.castShadow = true;
      headGroup.add(craniumMesh);

      // Tapered Muzzle / Snout
      const muzzleGeo = new THREE.ConeGeometry(0.32, 0.9, 6);
      const muzzleMesh = new THREE.Mesh(muzzleGeo, giraffeMaterial);
      muzzleMesh.position.set(0, -0.05, 0.75);
      muzzleMesh.rotation.x = Math.PI / 2 + 0.18;
      muzzleMesh.castShadow = true;
      headGroup.add(muzzleMesh);

      // Dark nostrils & mouth tip
      const snoutTipGeo = new THREE.SphereGeometry(0.24, 6, 6);
      const snoutTipMesh = new THREE.Mesh(snoutTipGeo, darkHornMaterial);
      snoutTipMesh.position.set(0, -0.15, 1.15);
      snoutTipMesh.scale.set(0.9, 0.7, 1.1);
      headGroup.add(snoutTipMesh);

      // Eyes
      const eyeGeo = new THREE.SphereGeometry(0.1, 8, 8);
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.1 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(0.3, 0.18, 0.28);
      const rightEye = leftEye.clone();
      rightEye.position.x = -0.3;
      headGroup.add(leftEye, rightEye);

      // Ears
      const earGeo = new THREE.ConeGeometry(0.12, 0.55, 4);
      const earLeft = new THREE.Mesh(earGeo, giraffeMaterial);
      earLeft.position.set(0.35, 0.32, -0.15);
      earLeft.rotation.set(-0.2, 0.3, -1.0);
      const earRight = earLeft.clone();
      earRight.position.x = -0.35;
      earRight.rotation.set(-0.2, -0.3, 1.0);
      headGroup.add(earLeft, earRight);

      // Ossicones (Horns with rounded tufts)
      function createOssicone(xPos) {
        const ossGroup = new THREE.Group();
        ossGroup.position.set(xPos, 0.42, 0.05);
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.055, 0.45, 6), giraffeMaterial);
        shaft.position.y = 0.2;
        const tip = new THREE.Mesh(new THREE.SphereGeometry(0.085, 6, 6), darkHornMaterial);
        tip.position.y = 0.44;
        ossGroup.add(shaft, tip);
        ossGroup.rotation.z = xPos > 0 ? -0.15 : 0.15;
        ossGroup.rotation.x = -0.1;
        return ossGroup;
      }
      headGroup.add(createOssicone(0.17));
      headGroup.add(createOssicone(-0.17));

      // 5. Tail
      const tailBase = new THREE.Group();
      tailBase.position.set(0, 0.3, -1.5);
      bodyGroup.add(tailBase);
      gParts.tail = tailBase;

      const tailStemGeo = new THREE.CylinderGeometry(0.05, 0.035, 1.6, 6);
      const tailStemMesh = new THREE.Mesh(tailStemGeo, giraffeMaterial);
      tailStemMesh.position.set(0, -0.75, -0.15);
      tailStemMesh.rotation.x = -0.15;
      tailBase.add(tailStemMesh);

      // Tail tuft
      const tuftGeo = new THREE.ConeGeometry(0.14, 0.5, 6);
      const tuftMesh = new THREE.Mesh(tuftGeo, darkHornMaterial);
      tuftMesh.position.set(0, -1.6, -0.28);
      tuftMesh.rotation.x = Math.PI - 0.2;
      tailBase.add(tuftMesh);

      // 6. Articulated Legs
      // Giraffe legs are exceptionally tall; forelimbs are longer than hindlimbs.
      gParts.legs = {
        FL: buildFrontLeg(0.5, 0.0, 1.2, 'FL'),
        FR: buildFrontLeg(-0.5, 0.0, 1.2, 'FR'),
        HL: buildHindLeg(0.48, -0.2, -1.1, 'HL'),
        HR: buildHindLeg(-0.48, -0.2, -1.1, 'HR'),
      };

      Object.values(gParts.legs).forEach(l => root.add(l.hip));

      scene.add(giraffeGroup);
    }

    // Helper: Front Leg (Shoulder/Upper Arm -> Knee/Lower Leg -> Pastern/Hoof)
    function buildFrontLeg(x, y, z, id) {
      const hip = new THREE.Group();
      hip.position.set(x, y, z);

      // Upper arm / shoulder
      const upperLength = 1.8;
      const upperGeo = new THREE.CylinderGeometry(0.18, 0.14, upperLength, 7);
      const upperMesh = new THREE.Mesh(upperGeo, giraffeMaterial);
      upperMesh.position.y = -upperLength / 2;
      upperMesh.castShadow = true;
      hip.add(upperMesh);

      // Knee joint
      const knee = new THREE.Group();
      knee.position.y = -upperLength;
      hip.add(knee);

      // Lower leg / Cannon bone (tall, slender)
      const lowerLength = 1.9;
      const lowerGeo = new THREE.CylinderGeometry(0.13, 0.10, lowerLength, 7);
      const lowerMesh = new THREE.Mesh(lowerGeo, giraffeMaterial);
      lowerMesh.position.y = -lowerLength / 2;
      lowerMesh.castShadow = true;
      knee.add(lowerMesh);

      // Ankle & Hoof
      const foot = new THREE.Group();
      foot.position.y = -lowerLength;
      knee.add(foot);

      const hoofGeo = new THREE.BoxGeometry(0.24, 0.25, 0.36);
      const hoofMesh = new THREE.Mesh(hoofGeo, hoofMaterial);
      hoofMesh.position.set(0, -0.12, 0.05);
      hoofMesh.castShadow = true;
      foot.add(hoofMesh);

      return { hip, knee, foot, id, isFront: true };
    }

    // Helper: Hind Leg (Thigh -> Hock/Shin -> Foot/Hoof)
    function buildHindLeg(x, y, z, id) {
      const hip = new THREE.Group();
      hip.position.set(x, y, z);

      // Thigh (muscular top)
      const upperLength = 1.6;
      const upperGeo = new THREE.CylinderGeometry(0.24, 0.14, upperLength, 7);
      const upperMesh = new THREE.Mesh(upperGeo, giraffeMaterial);
      upperMesh.position.y = -upperLength / 2;
      upperMesh.castShadow = true;
      hip.add(upperMesh);

      // Hock Joint (curves backwards)
      const knee = new THREE.Group();
      knee.position.y = -upperLength;
      hip.add(knee);

      // Lower leg / metatarsus
      const lowerLength = 1.8;
      const lowerGeo = new THREE.CylinderGeometry(0.13, 0.09, lowerLength, 7);
      const lowerMesh = new THREE.Mesh(lowerGeo, giraffeMaterial);
      lowerMesh.position.y = -lowerLength / 2;
      lowerMesh.castShadow = true;
      knee.add(lowerMesh);

      // Hoof
      const foot = new THREE.Group();
      foot.position.y = -lowerLength;
      knee.add(foot);

      const hoofGeo = new THREE.BoxGeometry(0.22, 0.24, 0.34);
      const hoofMesh = new THREE.Mesh(hoofGeo, hoofMaterial);
      hoofMesh.position.set(0, -0.12, 0.04);
      hoofMesh.castShadow = true;
      foot.add(hoofMesh);

      return { hip, knee, foot, id, isFront: false };
    }

    // -------------------------------------------------------------
    // Savannah Environment Generation
    // -------------------------------------------------------------
    const TERRAIN_SIZE = 260;
    const TERRAIN_SEGMENTS = 70;

    function buildSavannah() {
      // 1. Undulating Ground Terrain
      const terrainGeo = new THREE.PlaneGeometry(TERRAIN_SIZE, TERRAIN_SIZE, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
      terrainGeo.rotateX(-Math.PI / 2);

      // Displace vertices with smooth rolling hills noise
      const pos = terrainGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        // Soft elevation waves, flatter along the central walking corridor
        const flatCorridor = Math.min(1.0, Math.abs(x) / 12.0);
        const y = (Math.sin(x * 0.04) * Math.cos(z * 0.03) * 2.2 +
                   Math.sin((x + z) * 0.02) * 1.8) * flatCorridor;
        pos.setY(i, y);
      }
      terrainGeo.computeVertexNormals();

      // Earthy golden savannah dirt / grass material
      const terrainMat = new THREE.MeshStandardMaterial({
        color: 0xba9456,
        roughness: 0.95,
        metalness: 0.05,
        flatShading: true
      });
      groundMesh = new THREE.Mesh(terrainGeo, terrainMat);
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      // 2. Iconic Acacia Tortilis Trees (Umbrella Thorn)
      createAcaciaForest();

      // 3. Rocks, Dry Shrubs & Tall Grass Tufts
      createScatteredProps();

      // 4. Subtle Foot Dust Particle System
      createDustSystem();
    }

    // Acacia Tree Generator
    function createAcaciaTree() {
      const tree = new THREE.Group();

      // Weathered wood material
      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x332014,
        roughness: 0.9
      });

      // Olive/savannah dry foliage material
      const leafMat = new THREE.MeshStandardMaterial({
        color: 0x48582d,
        roughness: 0.85,
        flatShading: true
      });

      // Gnarled, branching trunk
      const trunkH = 5.0 + Math.random() * 2.5;
      const baseTrunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.35, 0.7, trunkH, 6),
        trunkMat
      );
      baseTrunk.position.y = trunkH / 2;
      baseTrunk.rotation.z = (Math.random() - 0.5) * 0.15;
      baseTrunk.castShadow = true;
      tree.add(baseTrunk);

      // Main branches radiating outward
      const numBranches = 3 + Math.floor(Math.random() * 2);
      for (let b = 0; b < numBranches; b++) {
        const branchAngle = (b / numBranches) * Math.PI * 2 + Math.random() * 0.5;
        const bLen = 3.5 + Math.random() * 2.0;
        
        const branchMesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.18, 0.3, bLen, 5),
          trunkMat
        );
        branchMesh.position.set(0, trunkH - 0.8, 0);
        branchMesh.rotation.y = branchAngle;
        branchMesh.rotation.z = 0.75 + Math.random() * 0.25;
        branchMesh.castShadow = true;
        tree.add(branchMesh);

        // Flat-topped umbrella foliage discs
        const canopyWidth = 3.8 + Math.random() * 2.5;
        const canopyThickness = 0.5 + Math.random() * 0.4;
        const foliage = new THREE.Mesh(
          new THREE.CylinderGeometry(canopyWidth, canopyWidth * 0.92, canopyThickness, 7),
          leafMat
        );
        foliage.position.set(
          Math.sin(branchAngle) * bLen * 0.7,
          trunkH + bLen * 0.55,
          Math.cos(branchAngle) * bLen * 0.7
        );
        foliage.castShadow = true;
        foliage.receiveShadow = true;
        tree.add(foliage);

        // Secondary tiered flat canopy for that signature layered African canopy
        if (Math.random() > 0.3) {
          const topCanopy = new THREE.Mesh(
            new THREE.CylinderGeometry(canopyWidth * 0.6, canopyWidth * 0.55, canopyThickness * 0.8, 6),
            leafMat
          );
          topCanopy.position.set(foliage.position.x, foliage.position.y + 0.5, foliage.position.z);
          topCanopy.castShadow = true;
          tree.add(topCanopy);
        }
      }

      return tree;
    }

    function createAcaciaForest() {
      const numTrees = 28;
      for (let i = 0; i < numTrees; i++) {
        const tree = createAcaciaTree();
        // Spread trees across the horizon, leaving central walking path clear
        let x = (Math.random() - 0.5) * 220;
        if (Math.abs(x) < 14) x += (x >= 0 ? 16 : -16); // keep corridor open
        const z = (Math.random() - 0.5) * 240;

        tree.position.set(x, 0, z);
        const s = 0.7 + Math.random() * 0.7;
        tree.scale.set(s, s, s);
        tree.rotation.y = Math.random() * Math.PI * 2;
        scene.add(tree);
        environmentProps.push(tree);
      }
    }

    function createScatteredProps() {
      // Shared Rock Geometry
      const rockGeo = new THREE.DodecahedronGeometry(1.2, 1);
      const rockMat = new THREE.MeshStandardMaterial({
        color: 0x8a7761,
        roughness: 0.9,
        flatShading: true
      });

      // Dry Grass Clump Geometry
      const grassMat = new THREE.MeshStandardMaterial({
        color: 0xaa8944,
        roughness: 0.9,
        side: THREE.DoubleSide
      });

      // Scatter rocks
      for (let i = 0; i < 45; i++) {
        const rock = new THREE.Mesh(rockGeo, rockMat);
        let x = (Math.random() - 0.5) * 180;
        if (Math.abs(x) < 4) x += (x >= 0 ? 5 : -5);
        const z = (Math.random() - 0.5) * 220;
        const s = 0.3 + Math.random() * 0.8;
        rock.scale.set(s * 1.4, s * 0.7, s);
        rock.position.set(x, s * 0.25, z);
        rock.rotation.set(Math.random(), Math.random(), Math.random());
        rock.castShadow = true;
        scene.add(rock);
        environmentProps.push(rock);
      }

      // Scatter dry grass tufts
      for (let g = 0; g < 90; g++) {
        const grassTuft = new THREE.Group();
        const blades = 4 + Math.floor(Math.random() * 4);
        for (let b = 0; b < blades; b++) {
          const blade = new THREE.Mesh(new THREE.ConeGeometry(0.12, 1.2 + Math.random() * 0.6, 3), grassMat);
          blade.position.y = 0.5;
          blade.rotation.z = (Math.random() - 0.5) * 0.4;
          blade.rotation.x = (Math.random() - 0.5) * 0.4;
          grassTuft.add(blade);
        }
        let gx = (Math.random() - 0.5) * 160;
        if (Math.abs(gx) < 3.5) gx += (gx >= 0 ? 4.5 : -4.5);
        const gz = (Math.random() - 0.5) * 220;
        grassTuft.position.set(gx, 0, gz);
        scene.add(grassTuft);
        environmentProps.push(grassTuft);
      }
    }

    // Dynamic Dust System kicked up under hooves
    const dustParticles = [];
    function createDustSystem() {
      const dustGeo = new THREE.SphereGeometry(0.2, 5, 5);
      const dustMat = new THREE.MeshBasicMaterial({
        color: 0xd6b685,
        transparent: true,
        opacity: 0.4
      });

      dustSystem = new THREE.Group();
      for (let i = 0; i < 40; i++) {
        const p = new THREE.Mesh(dustGeo, dustMat.clone());
        p.visible = false;
        p.userData = { life: 0, maxLife: 1.0, velY: 0, velX: 0, velZ: 0 };
        dustSystem.add(p);
        dustParticles.push(p);
      }
      scene.add(dustSystem);
    }

    function emitDust(x, z) {
      for (let i = 0; i < 2; i++) {
        const p = dustParticles.find(dp => !dp.visible);
        if (!p) return;
        p.visible = true;
        p.position.set(x + (Math.random() - 0.5) * 0.2, 0.1, z + (Math.random() - 0.5) * 0.2);
        p.scale.setScalar(0.4 + Math.random() * 0.5);
        p.material.opacity = 0.45;
        p.userData.life = 0;
        p.userData.maxLife = 0.5 + Math.random() * 0.4;
        p.userData.velY = 0.5 + Math.random() * 0.7;
        p.userData.velX = (Math.random() - 0.5) * 0.4;
        p.userData.velZ = (Math.random() - 0.5) * 0.4 + 0.3;
      }
    }

    function updateDust(dt) {
      dustParticles.forEach(p => {
        if (!p.visible) return;
        p.userData.life += dt;
        if (p.userData.life >= p.userData.maxLife) {
          p.visible = false;
          return;
        }
        const prog = p.userData.life / p.userData.maxLife;
        p.position.y += p.userData.velY * dt;
        p.position.x += p.userData.velX * dt;
        p.position.z += p.userData.velZ * dt;
        p.scale.addScalar(dt * 1.8);
        p.material.opacity = (1 - prog) * 0.35;
      });
    }

    // -------------------------------------------------------------
    // Atmospheric Lighting & Skydome Presets
    // -------------------------------------------------------------
    function setupAtmosphere() {
      // Hemispheric Ambient Light
      hemiLight = new THREE.HemisphereLight(0xffeedd, 0x553818, 0.85);
      scene.add(hemiLight);

      // Warm Directional Sun with crisp shadows
      sunLight = new THREE.DirectionalLight(0xfff1cf, 1.8);
      sunLight.position.set(40, 35, -30);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 130;
      sunLight.shadow.camera.left = -30;
      sunLight.shadow.camera.right = 30;
      sunLight.shadow.camera.top = 30;
      sunLight.shadow.camera.bottom = -30;
      sunLight.shadow.bias = -0.0005;
      scene.add(sunLight);

      // Savannah Atmospheric Fog
      scene.fog = new THREE.FogExp2(0xd69d58, 0.009);

      // Large Sky Dome
      const skyGeo = new THREE.SphereGeometry(380, 24, 24);
      const skyMat = new THREE.MeshBasicMaterial({
        color: 0xf3ae63,
        side: THREE.BackSide
      });
      skyMesh = new THREE.Mesh(skyGeo, skyMat);
      scene.add(skyMesh);

      applyTimeOfDay('golden');
    }

    function applyTimeOfDay(tod) {
      currentTOD = tod;
      if (tod === 'golden') {
        renderer.toneMappingExposure = 1.1;
        sunLight.color.setHex(0xffcb78);
        sunLight.intensity = 2.1;
        sunLight.position.set(45, 20, -35);
        hemiLight.color.setHex(0xffcca0);
        hemiLight.groundColor.setHex(0x5a3014);
        scene.fog.color.setHex(0xdca260);
        skyMesh.material.color.setHex(0xf8b668);
        renderer.setClearColor(0xdca260);
      } else if (tod === 'noon') {
        renderer.toneMappingExposure = 0.95;
        sunLight.color.setHex(0xffffff);
        sunLight.intensity = 2.4;
        sunLight.position.set(20, 60, 10);
        hemiLight.color.setHex(0xfff7e8);
        hemiLight.groundColor.setHex(0x6e522e);
        scene.fog.color.setHex(0xd8be94);
        skyMesh.material.color.setHex(0x99c2ec);
        renderer.setClearColor(0xd8be94);
      } else if (tod === 'dusk') {
        renderer.toneMappingExposure = 1.25;
        sunLight.color.setHex(0xff5722);
        sunLight.intensity = 1.6;
        sunLight.position.set(60, 8, -40);
        hemiLight.color.setHex(0xff7761);
        hemiLight.groundColor.setHex(0x27140e);
        scene.fog.color.setHex(0x9e4334);
        skyMesh.material.color.setHex(0x58243b);
        renderer.setClearColor(0x9e4334);
      }
    }

    // -------------------------------------------------------------
    // Quadruped Lateral Walk Cycle Physics & Kinematics
    // Giraffes use a lateral pacing gait: legs on the same side move
    // almost together (Right Hind & Right Front, then Left Hind & Left Front)
    // -------------------------------------------------------------
    let prevFootPlant = { FL: false, FR: false, HL: false, HR: false };

    function updateGiraffeWalk(delta) {
      if (!isPlaying) return;

      const cycleSpeed = 3.6 * walkSpeed;
      walkCycle += delta * cycleSpeed;

      // 1. Torso Dynamics (Gentle heave & roll)
      // Heave dips twice per cycle (frequency 2x)
      const heave = Math.sin(walkCycle * 2) * 0.08;
      gParts.root.position.y = 3.6 + heave;
      // Slender sway along the horizontal axis
      gParts.body.rotation.z = Math.sin(walkCycle) * 0.035;
      gParts.body.rotation.y = Math.cos(walkCycle) * 0.02;

      // 2. Neck & Head Synchronized Bobbing
      // Giraffes maintain dynamic equilibrium by pendular motion of the neck
      const neckBob = Math.sin(walkCycle - 0.4);
      gParts.neckBase.rotation.x = 0.08 + neckBob * 0.07;
      gParts.neckMid.rotation.x = 0.02 - neckBob * 0.04;
      gParts.head.rotation.x = -neckBob * 0.06;
      gParts.neckBase.rotation.z = Math.cos(walkCycle) * 0.02;

      // 3. Gentle Tail Swish
      gParts.tail.rotation.z = Math.sin(walkCycle * 0.8) * 0.25;
      gParts.tail.rotation.x = -0.1 + Math.abs(Math.cos(walkCycle)) * 0.15;

      // 4. Quadruped Leg Articulation (Lateral Pacing)
      // Lateral gait: Right legs are grouped around phase 0, Left legs around phase PI
      const legPhases = {
        FR: walkCycle,
        HR: walkCycle - 0.35,              // Hind leg follows front slightly
        FL: walkCycle + Math.PI,
        HL: walkCycle + Math.PI - 0.35
      };

      for (const key in gParts.legs) {
        const leg = gParts.legs[key];
        const phase = legPhases[key];

        // Angular forward-backward swing
        const swing = Math.sin(phase);
        leg.hip.rotation.x = swing * 0.38;

        // Knee flexion: bends backward during swing phase (when swinging forward off ground)
        if (swing > 0.05) {
          leg.knee.rotation.x = -swing * 0.75;
          leg.foot.rotation.x = swing * 0.3;
        } else {
          // Stance / Plant phase: leg straightens out to support body weight
          leg.knee.rotation.x = THREE.MathUtils.lerp(leg.knee.rotation.x, 0, 0.25);
          leg.foot.rotation.x = THREE.MathUtils.lerp(leg.foot.rotation.x, -0.05, 0.25);
        }

        // Hoof strike detection for dust emission
        const isPlanted = swing < -0.85;
        if (isPlanted && !prevFootPlant[key]) {
          // Just struck ground! Get world position of foot
          const footWorldPos = new THREE.Vector3();
          leg.foot.getWorldPosition(footWorldPos);
          emitDust(footWorldPos.x, footWorldPos.z);
        }
        prevFootPlant[key] = isPlanted;
      }
    }

    // -------------------------------------------------------------
    // Endless Savannah Scrolling (Infinite Treadmill Stream)
    // -------------------------------------------------------------
    function updateEnvironmentStream(delta) {
      if (!isPlaying) return;

      const travelDist = worldSpeed * walkSpeed * delta;

      // Move scenery backwards to create effortless continuous walking
      environmentProps.forEach(prop => {
        prop.position.z += travelDist;
        // Wrap scenery smoothly to the far horizon when it passes behind the camera
        if (prop.position.z > 95) {
          prop.position.z -= 230;
          // Re-randomize slightly to keep terrain organic
          prop.position.x = (Math.random() - 0.5) * 190;
          if (Math.abs(prop.position.x) < 4) {
            prop.position.x += (prop.position.x >= 0 ? 5 : -5);
          }
        }
      });
    }

    // -------------------------------------------------------------
    // Camera Control & Follow Modes
    // -------------------------------------------------------------
    function updateCamera(delta) {
      if (currentCamMode === 'follow') {
        // Smooth cinematic tracking from quarter-side perspective
        const targetPos = new THREE.Vector3(12, 6.2, 13);
        camera.position.lerp(targetPos, 0.04);
        const lookTarget = new THREE.Vector3(0, 3.8, 1.2);
        controls.target.lerp(lookTarget, 0.05);
        controls.update();
      } else if (currentCamMode === 'side') {
        // Dramatic side profile tracking shot
        const targetPos = new THREE.Vector3(22, 4.2, 0);
        camera.position.lerp(targetPos, 0.05);
        const lookTarget = new THREE.Vector3(0, 3.6, 0);
        controls.target.lerp(lookTarget, 0.05);
        controls.update();
      } else {
        // Free OrbitControls mode
        controls.update();
      }
    }

    // -------------------------------------------------------------
    // Initialization & Event Listeners
    // -------------------------------------------------------------
    function init() {
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 600);
      camera.position.set(13, 6, 14);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      // OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.maxPolarAngle = Math.PI / 2 - 0.02; // Keep above terrain ground
      controls.minDistance = 4;
      controls.maxDistance = 65;
      controls.target.set(0, 3.5, 0);

      // Build 3D Entities
      initMaterials();
      buildGiraffe();
      buildSavannah();
      setupAtmosphere();

      // UI Bindings
      setupUIEvents();

      // Window Resize Listener
      window.addEventListener('resize', onWindowResize, false);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // UI Toast Notification
    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2200);
    }

    function setupUIEvents() {
      // Camera Modes
      const btnFollow = document.getElementById('cam-follow');
      const btnSide = document.getElementById('cam-side');
      const btnOrbit = document.getElementById('cam-orbit');
      const camButtons = [btnFollow, btnSide, btnOrbit];

      function setActiveCam(activeBtn, mode, msg) {
        currentCamMode = mode;
        camButtons.forEach(b => {
          b.className = 'cam-btn px-3 py-1.5 rounded-xl text-xs font-medium transition-all text-amber-200/80 hover:text-white hover:bg-white/10';
        });
        activeBtn.className = 'cam-btn px-3 py-1.5 rounded-xl text-xs font-medium transition-all bg-amber-500 text-stone-950 font-semibold shadow';
        showToast(msg);
      }

      btnFollow.addEventListener('click', () => setActiveCam(btnFollow, 'follow', 'Cinematic Follow Camera'));
      btnSide.addEventListener('click', () => setActiveCam(btnSide, 'side', 'Side Profile Tracking View'));
      btnOrbit.addEventListener('click', () => setActiveCam(btnOrbit, 'orbit', 'Free Orbit Controls (Drag to rotate)'));

      // Allow dragging on canvas to automatically switch to orbit mode if in auto mode
      controls.addEventListener('start', () => {
        if (currentCamMode !== 'orbit') {
          setActiveCam(btnOrbit, 'orbit', 'Free Orbit Active');
        }
      });

      // Time of Day Presets
      const todGolden = document.getElementById('tod-golden');
      const todNoon = document.getElementById('tod-noon');
      const todDusk = document.getElementById('tod-dusk');
      const todButtons = [todGolden, todNoon, todDusk];

      function setActiveTOD(activeBtn, tod, label) {
        todButtons.forEach(b => {
          b.className = 'tod-btn px-2.5 py-1.5 rounded-xl text-xs flex items-center space-x-1 text-stone-300 hover:text-white hover:bg-white/10';
        });
        activeBtn.className = 'tod-btn px-2.5 py-1.5 rounded-xl text-xs flex items-center space-x-1 bg-amber-500/20 text-amber-300 border border-amber-500/40';
        applyTimeOfDay(tod);
        showToast(`Lighting: ${label}`);
      }

      todGolden.addEventListener('click', () => setActiveTOD(todGolden, 'golden', 'Golden Hour'));
      todNoon.addEventListener('click', () => setActiveTOD(todNoon, 'noon', 'High Noon'));
      todDusk.addEventListener('click', () => setActiveTOD(todDusk, 'dusk', 'Sunset Dusk'));

      // Speed Slider
      const sliderSpeed = document.getElementById('slider-speed');
      const speedDisplay = document.getElementById('speed-display');
      sliderSpeed.addEventListener('input', (e) => {
        walkSpeed = parseFloat(e.target.value);
        speedDisplay.innerText = walkSpeed.toFixed(1) + 'x';
      });

      // Play/Pause Toggle
      const btnPlay = document.getElementById('btn-play');
      const playIcon = document.getElementById('play-icon');
      btnPlay.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
          playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // pause bars
          showToast('Stride Resumed');
        } else {
          playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // play triangle
          showToast('Animation Paused');
        }
      });

      // Reset Camera
      document.getElementById('btn-reset').addEventListener('click', () => {
        setActiveCam(btnFollow, 'follow', 'Camera Reset');
        camera.position.set(13, 6, 14);
        controls.target.set(0, 3.5, 0);
      });
    }

    // -------------------------------------------------------------
    // Main Render Loop
    // -------------------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);

      updateGiraffeWalk(delta);
      updateEnvironmentStream(delta);
      updateDust(delta);
      updateCamera(delta);

      renderer.render(scene, camera);
    }

    // Start on window load
    window.onload = function () {
      init();
      animate();
    };
  </script>
</body>
</html>
