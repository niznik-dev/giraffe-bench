<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majestic Savannah Stroll</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ff7b00; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene, Camera, Renderer setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffaa44);
        scene.fog = new THREE.FogExp2(0xffaa44, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 25);
        camera.lookAt(0, 3, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting (Sunset vibe)
        const ambientLight = new THREE.AmbientLight(0xffeedd, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xff5500, 1.2);
        sunLight.position.set(20, 20, 10);
        scene.add(sunLight);

        // Savannah Ground
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xcc8833, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Build Procedural Giraffe
        const giraffeGroup = new THREE.Group();

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdd9933, roughness: 0.6 });
        const spotMat = new THREE.MeshStandardMaterial({ color: 0x552200, roughness: 0.6 });

        // Body
        const bodyGeo = new THREE.BoxGeometry(2, 2.5, 4);
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 5;
        giraffeGroup.add(body);

        // Neck
        const neckGeo = new THREE.CylinderGeometry(0.5, 0.8, 5, 8);
        const neck = new THREE.Mesh(neckGeo, bodyMat);
        neck.position.set(0, 5.5, 1.8);
        neck.rotation.x = -0.3;
        giraffeGroup.add(neck);

        // Head
        const headGeo = new THREE.BoxGeometry(1, 1, 1.8);
        const head = new THREE.Mesh(headGeo, bodyMat);
        head.position.set(0, 7.8, 2.6);
        giraffeGroup.add(head);

        // Legs (Front-Left, Front-Right, Back-Left, Back-Right)
        const legGeo = new THREE.CylinderGeometry(0.3, 0.2, 5, 8);
        legGeo.translate(0, -2.5, 0); // Pivot at top

        const legs = [];
        const positions = [
            [-0.8, 3.8, 1.5],  // FL
            [0.8, 3.8, 1.5],   // FR
            [-0.8, 3.8, -1.5], // BL
            [0.8, 3.8, -1.5]   // BR
        ];

        positions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, bodyMat);
            leg.position.set(...pos);
            giraffeGroup.add(leg);
            legs.push(leg);
        });

        scene.add(giraffeGroup);
        giraffeGroup.position.x = -20;

        // Animation Loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            let t = clock.getElapsedTime();

            // Walking motion across the savannah
            giraffeGroup.position.x = (t * 3) % 60 - 30;

            // Simple gait cycle using sine waves
            legs[0].rotation.x = Math.sin(t * 8) * 0.5; // FL
            legs[1].rotation.x = -Math.sin(t * 8) * 0.5; // FR
            legs[2].rotation.x = -Math.sin(t * 8) * 0.5; // BL
            legs[3].rotation.x = Math.sin(t * 8) * 0.5; // BR

            // Subtle body bobbing
            giraffeGroup.position.y = Math.abs(Math.sin(t * 16)) * 0.2;

            // Camera tracking
            camera.position.x = giraffeGroup.position.x + 10;
            camera.lookAt(giraffeGroup.position.x, 4, 0);

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
