<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giraffe on the savannah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pill-bg: rgba(255, 246, 228, 0.82);
    --pill-ink: #3a2414;
    --pill-line: rgba(58, 36, 20, 0.18);
    --page-bg: #e9b77c;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --pill-bg: rgba(38, 24, 14, 0.78);
      --pill-ink: #f6e3c4;
      --pill-line: rgba(246, 227, 196, 0.2);
      --page-bg: #2a1a10;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --pill-bg: rgba(38, 24, 14, 0.78);
    --pill-ink: #f6e3c4;
    --pill-line: rgba(246, 227, 196, 0.2);
    --page-bg: #2a1a10;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page-bg);
    overflow: hidden;
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .hud {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    margin-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 8px 8px 18px;
    background: var(--pill-bg);
    color: var(--pill-ink);
    border: 1px solid var(--pill-line);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    font-size: 14px;
    white-space: nowrap;
  }
  .hud button {
    font: inherit;
    font-weight: 600;
    color: var(--pill-ink);
    background: transparent;
    border: 1px solid var(--pill-line);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
  }
  .hud button:focus-visible { outline: 2px solid var(--pill-ink); outline-offset: 2px; }
  @media (max-width: 420px) { .hint { display: none; } }
</style>
</head>
<body>
<div class="hud">
  <span class="hint">Drag to look around, scroll to zoom</span>
  <button id="toggle" type="button">Pause</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  // ---------- Renderer, scene, camera ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const HORIZON = 0xecb87c;
  scene.fog = new THREE.Fog(HORIZON, 60, 330);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1200);

  // ---------- Lighting (late-afternoon sun) ----------
  const sunDir = new THREE.Vector3(-0.65, 0.32, -0.69).normalize();
  scene.add(new THREE.HemisphereLight(0xffe2b8, 0x7a5a32, 0.75));
  const sun = new THREE.DirectionalLight(0xffd59a, 1.05);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 90 });
  sun.shadow.bias = -0.0015;
  scene.add(sun, sun.target);

  // ---------- Sky dome + sun disc ----------
  {
    const geo = new THREE.SphereGeometry(600, 32, 16);
    const cols = [];
    const top = new THREE.Color(0x6f8fbe), mid = new THREE.Color(0xf0b47a), hor = new THREE.Color(HORIZON);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = pos.getY(i) / 600;
      const c = y > 0.18 ? mid.clone().lerp(top, Math.min(1, (y - 0.18) / 0.6))
                         : hor.clone().lerp(mid, Math.max(0, y / 0.18));
      cols.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
  }
  const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(16, 40), new THREE.MeshBasicMaterial({ color: 0xfff3d2, fog: false }));
  const sunGlow = new THREE.Mesh(new THREE.CircleGeometry(48, 40), new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.28, fog: false, depthWrite: false }));
  sunDisc.position.copy(sunDir).multiplyScalar(520);
  sunGlow.position.copy(sunDir).multiplyScalar(525);
  scene.add(sunGlow, sunDisc);

  // ---------- Terrain ----------
  const heightAt = (x, z) => 0.55 * Math.sin(x * 0.045) * Math.cos(z * 0.038) + 0.25 * Math.sin(x * 0.12 + z * 0.07);
  {
    const geo = new THREE.PlaneGeometry(700, 700, 180, 180);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const cols = [];
    const dry = new THREE.Color(0xd2a45c), dark = new THREE.Color(0xa4783e), olive = new THREE.Color(0x9a8f4c);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      pos.setY(i, heightAt(x, z));
      const n = 0.5 + 0.5 * Math.sin(x * 0.09) * Math.sin(z * 0.11 + 1.3);
      const m = 0.5 + 0.5 * Math.sin(x * 0.031 + z * 0.027);
      const c = dry.clone().lerp(dark, n * 0.55).lerp(olive, m * 0.35);
      cols.push(c.r, c.g, c.b);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
    geo.computeVertexNormals();
    const ground = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
    ground.receiveShadow = true;
    scene.add(ground);
  }

  // ---------- Grass tufts (instanced) ----------
  {
    const COUNT = 7000;
    const blade = new THREE.ConeGeometry(0.06, 0.7, 3);
    blade.translate(0, 0.35, 0);
    const mesh = new THREE.InstancedMesh(blade, new THREE.MeshLambertMaterial(), COUNT);
    const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3();
    const c = new THREE.Color();
    for (let i = 0; i < COUNT; i++) {
      const r = 4 + Math.pow(Math.random(), 0.7) * 150, a = Math.random() * Math.PI * 2;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      p.set(x, heightAt(x, z), z);
      e.set((Math.random() - 0.5) * 0.5, Math.random() * Math.PI, (Math.random() - 0.5) * 0.5);
      q.setFromEuler(e);
      const k = 0.6 + Math.random() * 1.1;
      s.set(k, k * (0.7 + Math.random() * 0.8), k);
      m.compose(p, q, s);
      mesh.setMatrixAt(i, m);
      c.setHSL(0.1 + Math.random() * 0.04, 0.45 + Math.random() * 0.2, 0.45 + Math.random() * 0.18);
      mesh.setColorAt(i, c);
    }
    scene.add(mesh);
  }

  // ---------- Acacia trees ----------
  const barkMat = new THREE.MeshLambertMaterial({ color: 0x4a3322 });
  const leafMat = new THREE.MeshLambertMaterial({ color: 0x5b6a2e, flatShading: true });
  function acacia(x, z, s) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.32, 4.2, 7), barkMat);
    trunk.position.y = 2.1; trunk.rotation.z = 0.08;
    g.add(trunk);
    [[-1, 0.5], [1, -0.4], [0.2, 1]].forEach(([dx, dz]) => {
      const br = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.14, 2.2, 6), barkMat);
      br.position.set(dx * 0.6, 4.7, dz * 0.5);
      br.rotation.set(dz * 0.5, 0, -dx * 0.55);
      g.add(br);
    });
    const canopyGeo = new THREE.SphereGeometry(1, 9, 6);
    [[0, 0, 3.4, 0.7], [-1.6, 0.4, 2.2, 0.55], [1.7, -0.3, 2.3, 0.6]].forEach(([cx, cz, w, h]) => {
      const leaf = new THREE.Mesh(canopyGeo, leafMat);
      leaf.position.set(cx, 5.8 + h * 0.3, cz);
      leaf.scale.set(w, h, w * 0.9);
      leaf.castShadow = true;
      g.add(leaf);
    });
    g.traverse(o => { if (o.isMesh) o.castShadow = true; });
    g.position.set(x, heightAt(x, z) - 0.1, z);
    g.scale.setScalar(s);
    g.rotation.y = Math.random() * Math.PI * 2;
    scene.add(g);
  }
  [[6, -8, 1.3], [-48, 14, 1.1], [52, -30, 1.2], [-20, -62, 1.4], [70, 40, 1.0], [-80, -20, 1.2],
   [18, 75, 1.1], [-60, 70, 1.3], [110, -5, 1.4], [-120, 60, 1.2], [40, -110, 1.1], [-15, 120, 1.0]]
    .forEach(([x, z, s]) => acacia(x, z, s));

  // ---------- Distant hills ----------
  {
    const hillMat = new THREE.MeshLambertMaterial({ color: 0xb98d62 });
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2 + 0.3;
      const hill = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), hillMat);
      hill.position.set(Math.cos(a) * 270, -4, Math.sin(a) * 270);
      hill.scale.set(40 + Math.random() * 40, 14 + Math.random() * 16, 30 + Math.random() * 20);
      scene.add(hill);
    }
  }

  // ---------- Giraffe coat texture (reticulated patches) ----------
  function makeCoat() {
    const N = 256, cv = document.createElement('canvas');
    cv.width = cv.height = N;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(N, N);
    const pts = [];
    for (let i = 0; i < 38; i++) pts.push([Math.random() * N, Math.random() * N, 0.8 + Math.random() * 0.35]);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let d1 = 1e9, d2 = 1e9, idx = 0;
      for (let k = 0; k < pts.length; k++) {
        let dx = Math.abs(x - pts[k][0]), dy = Math.abs(y - pts[k][1]);
        dx = Math.min(dx, N - dx); dy = Math.min(dy, N - dy);
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < d1) { d2 = d1; d1 = d; idx = k; } else if (d < d2) d2 = d;
      }
      const o = (y * N + x) * 4;
      if (d2 - d1 < 4.5) { img.data[o] = 238; img.data[o + 1] = 216; img.data[o + 2] = 172; }
      else { const v = pts[idx][2]; img.data[o] = 158 * v; img.data[o + 1] = 88 * v; img.data[o + 2] = 40 * v; }
      img.data[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(cv);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }
  const baseCoat = makeCoat();
  const coatMat = (rx, ry) => {
    const t = baseCoat.clone(); t.needsUpdate = true; t.repeat.set(rx, ry);
    return new THREE.MeshLambertMaterial({ map: t });
  };
  const bodyMat = coatMat(2, 2), neckMat = coatMat(1, 2.5), legMat = coatMat(1, 1.2), headMat = coatMat(0.7, 0.7);
  const creamMat = new THREE.MeshLambertMaterial({ color: 0xe9d3a6 });
  const darkMat = new THREE.MeshLambertMaterial({ color: 0x2e1c10 });
  const maneMat = new THREE.MeshLambertMaterial({ color: 0x6b3e1c });

  // ---------- Build the giraffe ----------
  const giraffe = new THREE.Group();
  const body = new THREE.Group();          // bobs up and down; legs hang from it
  body.position.y = 2.72;
  giraffe.add(body);

  const torso = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 18), bodyMat);
  torso.scale.set(0.62, 0.72, 1.28);
  torso.rotation.x = -0.16;               // back slopes down toward the tail
  body.add(torso);

  // Neck
  const neckPivot = new THREE.Group();
  neckPivot.position.set(0, 0.38, 0.95);
  body.add(neckPivot);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.36, 2.7, 14), neckMat);
  neck.position.y = 1.35;
  neckPivot.add(neck);
  const mane = new THREE.Mesh(new THREE.BoxGeometry(0.06, 2.5, 0.12), maneMat);
  mane.position.set(0, 1.35, -0.25);
  mane.rotation.x = 0.06;
  neckPivot.add(mane);

  // Head
  const head = new THREE.Group();
  head.position.y = 2.68;
  neckPivot.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12), headMat);
  skull.scale.set(0.2, 0.22, 0.32);
  skull.position.z = 0.08;
  head.add(skull);
  const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.17, 0.5, 12), creamMat);
  muzzle.rotation.x = Math.PI / 2;
  muzzle.position.set(0, -0.05, 0.45);
  head.add(muzzle);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 8), creamMat);
  nose.position.set(0, -0.06, 0.7);
  nose.scale.set(1, 0.85, 0.8);
  head.add(nose);
  [-1, 1].forEach(sx => {
    const oss = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.28, 8), headMat);
    oss.position.set(sx * 0.08, 0.3, -0.06);
    oss.rotation.z = -sx * 0.12;
    head.add(oss);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), darkMat);
    tip.position.set(sx * 0.098, 0.45, -0.06);
    head.add(tip);
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.24, 8), creamMat);
    ear.position.set(sx * 0.24, 0.16, -0.12);
    ear.rotation.z = -sx * 1.2;
    head.add(ear);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), darkMat);
    eye.position.set(sx * 0.17, 0.07, 0.14);
    head.add(eye);
  });

  // Tail
  const tailPivot = new THREE.Group();
  tailPivot.position.set(0, 0.12, -1.22);
  body.add(tailPivot);
  const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.05, 1.1, 6), bodyMat);
  tail.position.y = -0.55;
  tailPivot.add(tail);
  const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 6), darkMat);
  tuft.scale.set(0.8, 2, 0.8);
  tuft.position.y = -1.18;
  tailPivot.add(tuft);

  // Legs: hip pivot -> upper leg -> knee pivot -> lower leg -> hoof
  function makeLeg(x, y, z, upper, lower) {
    const hip = new THREE.Group();
    hip.position.set(x, y, z);
    const u = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.1, upper, 10), legMat);
    u.position.y = -upper / 2;
    hip.add(u);
    const knee = new THREE.Group();
    knee.position.y = -upper;
    hip.add(knee);
    const joint = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), legMat);
    knee.add(joint);
    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.07, lower - 0.12, 10), creamMat);
    l.position.y = -(lower - 0.12) / 2;
    knee.add(l);
    const hoof = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 0.14, 10), darkMat);
    hoof.position.y = -lower + 0.07;
    knee.add(hoof);
    body.add(hip);
    return { hip, knee };
  }
  // y is relative to body center (2.72): front hips sit higher, giving the sloping back
  const legs = {
    fl: makeLeg( 0.3,  0.05,  0.85, 1.42, 1.35),
    fr: makeLeg(-0.3,  0.05,  0.85, 1.42, 1.35),
    hl: makeLeg( 0.3, -0.18, -0.88, 1.27, 1.27),
    hr: makeLeg(-0.3, -0.18, -0.88, 1.27, 1.27),
  };

  giraffe.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(giraffe);

  // ---------- Motion ----------
  const PATH_R = 30, FREQ = 0.62, SWING = 0.36;
  const strideLen = 2 * 2.6 * Math.sin(SWING) * 2;   // ground covered per gait cycle
  const SPEED = strideLen * FREQ;
  let travelled = 0, phaseTime = 0;

  function pose(p) {
    // Giraffes pace: both legs on one side move together
    const sides = [['fl', 'hl', p], ['fr', 'hr', p + Math.PI]];
    sides.forEach(([front, hind, ph]) => {
      const swing = -Math.sin(ph) * SWING;
      const lift = Math.max(0, Math.cos(ph));
      legs[front].hip.rotation.x = swing;
      legs[front].knee.rotation.x = lift * 0.75;
      legs[hind].hip.rotation.x = swing * 0.9;
      legs[hind].knee.rotation.x = lift * 0.6;
    });
    body.position.y = 2.72 + 0.05 * Math.cos(2 * p);
    body.rotation.z = 0.035 * Math.sin(p);           // side-to-side roll of the pace
    neckPivot.rotation.x = 0.42 + 0.07 * Math.sin(p * 2 + 0.6);
    head.rotation.x = 0.2 - neckPivot.rotation.x - 0.05 * Math.sin(p * 2 + 0.6);
    tailPivot.rotation.x = 0.25 + 0.12 * Math.sin(p * 1.3);
    tailPivot.rotation.z = 0.15 * Math.sin(p * 0.9);
  }

  function placeGiraffe() {
    const a = travelled / PATH_R;
    const x = Math.cos(a) * PATH_R, z = Math.sin(a) * PATH_R;
    giraffe.position.set(x, heightAt(x, z), z);
    giraffe.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a));
  }

  // ---------- Camera orbit (drag + wheel) ----------
  let yaw = Math.PI / 2 + 0.35, pitch = 0.16, dist = 14;
  const camTarget = new THREE.Vector3();
  let dragging = false, lastX = 0, lastY = 0;
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    yaw -= (e.clientX - lastX) * 0.006;
    pitch = Math.min(1.2, Math.max(0.03, pitch + (e.clientY - lastY) * 0.004));
    lastX = e.clientX; lastY = e.clientY;
  });
  const end = () => { dragging = false; };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => { e.preventDefault(); dist = Math.min(45, Math.max(6, dist * (1 + e.deltaY * 0.001))); }, { passive: false });

  function updateCamera(snap) {
    const h = giraffe.rotation.y + yaw;
    camTarget.set(giraffe.position.x, giraffe.position.y + 3.2, giraffe.position.z);
    const want = new THREE.Vector3(
      camTarget.x + Math.sin(h) * Math.cos(pitch) * dist,
      camTarget.y + Math.sin(pitch) * dist,
      camTarget.z + Math.cos(h) * Math.cos(pitch) * dist
    );
    const floor = heightAt(want.x, want.z) + 0.6;
    if (want.y < floor) want.y = floor;
    if (snap) camera.position.copy(want); else camera.position.lerp(want, 0.08);
    camera.lookAt(camTarget);
  }

  // ---------- Play / pause ----------
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduceMotion;
  const btn = document.getElementById('toggle');
  const syncBtn = () => { btn.textContent = playing ? 'Pause' : 'Play'; };
  syncBtn();
  btn.addEventListener('click', () => { playing = !playing; syncBtn(); });

  // ---------- Loop ----------
  const clock = new THREE.Clock();
  placeGiraffe();
  pose(0);
  updateCamera(true);

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (playing) {
      travelled += SPEED * dt;
      phaseTime += dt;
      placeGiraffe();
      pose(phaseTime * FREQ * Math.PI * 2);
    }
    updateCamera(false);
    sun.position.copy(giraffe.position).addScaledVector(sunDir, 45);
    sun.target.position.copy(giraffe.position);
    sunDisc.lookAt(camera.position);
    sunGlow.lookAt(camera.position);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>
</body>
</html>
