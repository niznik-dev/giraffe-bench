<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giraffe on the Savannah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,500&display=swap">
<style>
  :root {
    --bg: #e9caa2;
    --ink: #2a1f16;
    --ink-soft: #5e4b3a;
    --veil: rgba(255, 247, 236, 0.76);
    --veil-edge: rgba(42, 31, 22, 0.12);
    --btn: rgba(255, 247, 236, 0.84);
    --btn-hover: rgba(255, 252, 247, 0.96);
    --focus: #2a1f16;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1712;
      --ink: #f4e8d6;
      --ink-soft: #d0bea7;
      --veil: rgba(29, 23, 18, 0.72);
      --veil-edge: rgba(244, 232, 214, 0.14);
      --btn: rgba(29, 23, 18, 0.8);
      --btn-hover: rgba(44, 35, 27, 0.94);
      --focus: #f4e8d6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1712;
    --ink: #f4e8d6;
    --ink-soft: #d0bea7;
    --veil: rgba(29, 23, 18, 0.72);
    --veil-edge: rgba(244, 232, 214, 0.14);
    --btn: rgba(29, 23, 18, 0.8);
    --btn-hover: rgba(44, 35, 27, 0.94);
    --focus: #f4e8d6;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  [hidden] { display: none !important; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Spectral", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas.dragging { cursor: grabbing; }
  .caption {
    position: fixed;
    left: 0;
    bottom: 0;
    padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 1.25rem) calc(env(safe-area-inset-left, 0px) + 1.25rem);
    pointer-events: none;
  }
  .card {
    max-width: min(21rem, calc(100vw - 2.5rem));
    padding: 0.8rem 1.05rem 0.9rem;
    background: var(--veil);
    border: 1px solid var(--veil-edge);
    border-radius: 0.85rem;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .species { margin: 0; font-size: 1.3rem; font-style: italic; font-weight: 500; line-height: 1.15; }
  .scene-line { margin: 0.2rem 0 0; font-size: 0.95rem; line-height: 1.45; color: var(--ink-soft); }
  .hint { margin: 0.5rem 0 0; font-size: 0.875rem; line-height: 1.45; color: var(--ink-soft); transition: opacity 0.8s ease; }
  .hint.gone { opacity: 0; }
  .notice { margin: 0.5rem 0 0; font-size: 0.95rem; line-height: 1.45; }
  .controls {
    position: fixed;
    right: 0;
    bottom: 0;
    display: flex;
    gap: 0.5rem;
    padding: 0 calc(env(safe-area-inset-right, 0px) + 1.25rem) calc(env(safe-area-inset-bottom, 0px) + 1.25rem) 0;
  }
  .controls button {
    min-height: 2.5rem;
    padding: 0.45rem 1rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--btn);
    border: 1px solid var(--veil-edge);
    border-radius: 999px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .controls button:hover { background: var(--btn-hover); }
  .controls button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (max-width: 600px) {
    .controls { top: 0; bottom: auto; padding: calc(env(safe-area-inset-top, 0px) + 1rem) calc(env(safe-area-inset-right, 0px) + 1rem) 0 0; }
    .caption { padding-left: calc(env(safe-area-inset-left, 0px) + 1rem); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 1rem); }
    .species { font-size: 1.15rem; }
  }
  @media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="caption">
  <div class="card">
    <h1 class="species">Giraffa camelopardalis</h1>
    <p class="scene-line">Late afternoon on the savannah</p>
    <p class="hint" id="hint">Drag to look around. Scroll to zoom.</p>
    <p class="notice" id="notice" hidden></p>
  </div>
</div>
<div class="controls" id="controls">
  <button type="button" id="pause">Pause</button>
  <button type="button" id="reset">Reset view</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  /* ---------- page wiring ---------- */
  const stage = document.getElementById('stage');
  const hintEl = document.getElementById('hint');
  const noticeEl = document.getElementById('notice');
  const controlsEl = document.getElementById('controls');
  const pauseBtn = document.getElementById('pause');
  const resetBtn = document.getElementById('reset');
  const mq = (q) => !!(window.matchMedia && window.matchMedia(q).matches);
  const coarse = mq('(pointer: coarse)');
  const reduceMotion = mq('(prefers-reduced-motion: reduce)');
  if (coarse) hintEl.textContent = 'Drag to look around. Pinch to zoom.';

  function showProblem(msg) {
    noticeEl.textContent = msg;
    noticeEl.hidden = false;
    hintEl.hidden = true;
    controlsEl.hidden = true;
  }
  if (typeof THREE === 'undefined') {
    showProblem('The 3D library didn’t load, so the scene can’t start. Reload the page to try again.');
    return;
  }
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    showProblem('This scene needs WebGL. Turn on hardware acceleration in your browser, then reload.');
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, coarse ? 1.75 : 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const canvas = renderer.domElement;
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', 'Animated 3D scene of a giraffe walking a dusty trail through golden grass and acacia trees, with a snow-capped mountain on the horizon');
  stage.appendChild(canvas);

  /* ---------- helpers ---------- */
  const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const wrap01 = (x) => ((x % 1) + 1) % 1;
  const deg = (d) => (d * Math.PI) / 180;
  function mulberry32(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(20261023);
  const rr = (a, b) => a + (b - a) * rand();
  function hash2(x, y) {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
    return s - Math.floor(s);
  }
  function vnoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y) {
    let v = 0, amp = 0.5, f = 1;
    for (let i = 0; i < 4; i++) { v += amp * vnoise(x * f, y * f); f *= 2.03; amp *= 0.5; }
    return v;
  }
  const tmpC = new THREE.Color();
  const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
  const _p = new THREE.Vector3(), _e = new THREE.Euler();

  /* ---------- the trail: a wobbly loop the giraffe follows ---------- */
  const PATH = { r0: 68, a: 9, pa: 0.6, b: 5, pb: 1.9 };
  const pathR = (th) => PATH.r0 + PATH.a * Math.sin(2 * th + PATH.pa) + PATH.b * Math.sin(3 * th + PATH.pb);
  const pathDist = (x, z) => Math.abs(Math.hypot(x, z) - pathR(Math.atan2(z, x)));
  const PATH_N = 1440;
  const pathXZ = new Float64Array(PATH_N * 2);
  for (let i = 0; i < PATH_N; i++) {
    const th = (i / PATH_N) * Math.PI * 2, r = pathR(th);
    pathXZ[i * 2] = Math.cos(th) * r;
    pathXZ[i * 2 + 1] = Math.sin(th) * r;
  }
  const pathCum = new Float64Array(PATH_N + 1);
  for (let i = 1; i <= PATH_N; i++) {
    const a = (i - 1) * 2, b = (i % PATH_N) * 2;
    pathCum[i] = pathCum[i - 1] + Math.hypot(pathXZ[b] - pathXZ[a], pathXZ[b + 1] - pathXZ[a + 1]);
  }
  const PATH_LEN = pathCum[PATH_N];
  function pathAt(s, out) {
    s = ((s % PATH_LEN) + PATH_LEN) % PATH_LEN;
    let lo = 0, hi = PATH_N;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (pathCum[mid] <= s) lo = mid; else hi = mid;
    }
    const f = (s - pathCum[lo]) / Math.max(pathCum[lo + 1] - pathCum[lo], 1e-6);
    const a = lo * 2, b = ((lo + 1) % PATH_N) * 2;
    return out.set(pathXZ[a] + (pathXZ[b] - pathXZ[a]) * f, pathXZ[a + 1] + (pathXZ[b + 1] - pathXZ[a + 1]) * f);
  }

  /* ---------- terrain: gentle near the trail, rolling hills far away ---------- */
  function terrainH(x, z) {
    const d = Math.hypot(x, z);
    let h = (fbm(x * 0.011 + 3.1, z * 0.011 - 1.7) - 0.47) * 7.0;
    h *= 0.16 + 0.84 * smooth(3, 32, pathDist(x, z));
    h += fbm(x * 0.0045 - 9.0, z * 0.0045 + 4.0) * 46 * smooth(230, 560, d);
    return h;
  }

  /* ---------- scene, sky and light ---------- */
  const scene = new THREE.Scene();
  const FOG_HEX = 0xe9caa2;
  scene.fog = new THREE.Fog(FOG_HEX, 50, 380);
  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.3, 4000);

  const SUN_EL = deg(24), SUN_AZ = deg(70);
  const sunDir = new THREE.Vector3(Math.cos(SUN_EL) * Math.cos(SUN_AZ), Math.sin(SUN_EL), Math.cos(SUN_EL) * Math.sin(SUN_AZ)).normalize();

  const skyGroup = new THREE.Group();
  scene.add(skyGroup);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uTop: { value: new THREE.Color(0x6a8fc6) },
      uMid: { value: new THREE.Color(0xb6c2d6) },
      uHorizon: { value: new THREE.Color(FOG_HEX) },
      uGlow: { value: new THREE.Color(0xffc483) },
      uCore: { value: new THREE.Color(0xfff5e0) },
      uSun: { value: sunDir },
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uTop;
      uniform vec3 uMid;
      uniform vec3 uHorizon;
      uniform vec3 uGlow;
      uniform vec3 uCore;
      uniform vec3 uSun;
      varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        float up = max(d.y, 0.0);
        vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.2, up));
        col = mix(col, uTop, smoothstep(0.1, 0.8, up));
        float s = max(dot(d, uSun), 0.0);
        col += uGlow * (pow(s, 5.0) * 0.3 + pow(s, 40.0) * 0.45);
        col = mix(col, uCore, smoothstep(0.99985, 0.99993, s));
        col = mix(uHorizon, col, smoothstep(-0.04, 0.0, d.y));
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1800, 40, 20), skyMat);
  skyDome.frustumCulled = false;
  skyGroup.add(skyDome);

  scene.add(new THREE.HemisphereLight(lin(0xc4d2ee), lin(0x8e6b44), 0.78));
  const sun = new THREE.DirectionalLight(lin(0xffd3a2), 2.25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  const SH = 32;
  Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 20, far: 240 });
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.00012;
  sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);
  const sunRight = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), sunDir).normalize();
  const sunUp = new THREE.Vector3().crossVectors(sunDir, sunRight).normalize();
  const texel = (2 * SH) / 2048;
  const _sp = new THREE.Vector3();
  function updateSun(focus) {
    // Snap the shadow camera to whole texels so shadows don't shimmer as it follows the giraffe.
    const r = Math.round(focus.dot(sunRight) / texel) * texel;
    const u = Math.round(focus.dot(sunUp) / texel) * texel;
    _sp.set(0, 0, 0).addScaledVector(sunRight, r).addScaledVector(sunUp, u).addScaledVector(sunDir, focus.dot(sunDir));
    sun.target.position.copy(_sp);
    sun.position.copy(_sp).addScaledVector(sunDir, 120);
  }

  /* ---------- ground ---------- */
  const groundGeo = new THREE.PlaneGeometry(1400, 1400, 240, 240);
  groundGeo.rotateX(-Math.PI / 2);
  {
    const p = groundGeo.attributes.position;
    const col = new Float32Array(p.count * 3);
    const cA = lin(0xcfa760), cB = lin(0xb68d4c), cG = lin(0x9d9a57), cD = lin(0xa98257);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), z = p.getZ(i);
      p.setY(i, terrainH(x, z));
      tmpC.copy(cA).lerp(cB, smooth(0.32, 0.68, fbm(x * 0.03 + 11, z * 0.03 - 4)));
      tmpC.lerp(cG, 0.5 * smooth(0.52, 0.8, fbm(x * 0.017 - 2, z * 0.017 + 9)));
      tmpC.lerp(cD, 0.45 * smooth(0.6, 0.82, fbm(x * 0.05 + 40, z * 0.05 - 30)));
      col[i * 3] = tmpC.r; col[i * 3 + 1] = tmpC.g; col[i * 3 + 2] = tmpC.b;
    }
    groundGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    groundGeo.computeVertexNormals();
  }
  const GLSL_HASH2 = `
    float gHash(vec2 p) {
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    float gNoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = gHash(i);
      float b = gHash(i + vec2(1.0, 0.0));
      float c = gHash(i + vec2(0.0, 1.0));
      float d = gHash(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
  `;
  const GROUND_FRAG = `
#include <color_fragment>
{
  float th = atan(vGPos.z, vGPos.x);
  float pr = ${PATH.r0.toFixed(3)} + ${PATH.a.toFixed(3)} * sin(2.0 * th + ${PATH.pa.toFixed(3)}) + ${PATH.b.toFixed(3)} * sin(3.0 * th + ${PATH.pb.toFixed(3)});
  float pd = abs(length(vGPos.xz) - pr);
  float n1 = gNoise(vGPos.xz * 0.85);
  float n2 = gNoise(vGPos.xz * 0.23 + 17.0);
  float n3 = gNoise(vGPos.xz * 3.3 - 5.0);
  float trail = 1.0 - smoothstep(0.45 + n2 * 0.5, 1.55 + n2 * 1.1, pd);
  trail *= 0.7 + 0.3 * n1;
  diffuseColor.rgb = mix(diffuseColor.rgb, uDirt * (0.9 + 0.2 * n3), trail * 0.9);
  diffuseColor.rgb *= 0.86 + 0.2 * n1 + 0.08 * n3;
}
`;
  const groundMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  groundMat.onBeforeCompile = (shader) => {
    shader.uniforms.uDirt = { value: lin(0xb08657) };
    shader.vertexShader = 'varying vec3 vGPos;\n' + shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n  vGPos = (modelMatrix * vec4(transformed, 1.0)).xyz;'
    );
    shader.fragmentShader = 'uniform vec3 uDirt;\nvarying vec3 vGPos;\n' + GLSL_HASH2 +
      shader.fragmentShader.replace('#include <color_fragment>', GROUND_FRAG);
  };
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.receiveShadow = true;
  scene.add(ground);

  /* ---------- giraffe coat: a reticulated Voronoi pattern baked onto rest-pose positions ---------- */
  const PATTERN_GLSL = `
vec3 gfHash(vec3 p3) {
  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}
vec3 gfVoronoi(vec3 x) {
  vec3 n = floor(x);
  vec3 f = fract(x);
  float f1 = 8.0;
  float f2 = 8.0;
  float id = 0.0;
  for (int k = -1; k <= 1; k++) {
    for (int j = -1; j <= 1; j++) {
      for (int i = -1; i <= 1; i++) {
        vec3 g = vec3(float(i), float(j), float(k));
        vec3 o = gfHash(n + g);
        vec3 r = g + 0.15 + 0.7 * o - f;
        float d = dot(r, r);
        if (d < f1) { f2 = f1; f1 = d; id = o.z; }
        else if (d < f2) { f2 = d; }
      }
    }
  }
  return vec3(sqrt(f1), sqrt(f2), id);
}
`;
  const PATTERN_FRAG = `
#include <color_fragment>
{
  vec3 vor = gfVoronoi(vPat * uPatScale);
  float edge = vor.y - vor.x;
  float aa = fwidth(edge) + 0.004;
  float m = smoothstep(uLineW - aa, uLineW + aa, edge);
  vec3 patchCol = mix(uPatchA, uPatchB, vor.z);
  patchCol *= 1.0 - 0.18 * smoothstep(0.22, 0.7, edge);
  m *= smoothstep(uFadeLo, uFadeHi, dot(vPat, uFadeAxis));
  diffuseColor.rgb = mix(uBase, patchCol, m);
}
`;
  function patternMaterial(o) {
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.78, metalness: 0 });
    const u = {
      uPatScale: { value: o.scale }, uLineW: { value: o.line },
      uBase: { value: lin(o.base) }, uPatchA: { value: lin(o.a) }, uPatchB: { value: lin(o.b) },
      uFadeAxis: { value: o.axis }, uFadeLo: { value: o.lo }, uFadeHi: { value: o.hi },
    };
    mat.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, u);
      shader.vertexShader = 'attribute vec3 aPat;\nvarying vec3 vPat;\n' +
        shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n  vPat = aPat;');
      shader.fragmentShader = [
        'uniform float uPatScale;', 'uniform float uLineW;', 'uniform vec3 uBase;', 'uniform vec3 uPatchA;',
        'uniform vec3 uPatchB;', 'uniform vec3 uFadeAxis;', 'uniform float uFadeLo;', 'uniform float uFadeHi;',
        'varying vec3 vPat;', PATTERN_GLSL, '',
      ].join('\n') + shader.fragmentShader.replace('#include <color_fragment>', PATTERN_FRAG);
    };
    return mat;
  }
  const matBody = patternMaterial({ scale: 4.6, line: 0.13, base: 0xf0e0c0, a: 0xa65020, b: 0x7c3815, axis: new THREE.Vector3(0, 1, 0), lo: 1.12, hi: 1.7 });
  const matHead = patternMaterial({ scale: 15, line: 0.2, base: 0xf0e0c0, a: 0x9e4b1d, b: 0x7a3916, axis: new THREE.Vector3(0, 0, -1), lo: -0.36, hi: -0.17 });
  const matLeg = new THREE.MeshStandardMaterial({ color: lin(0xede0c3), roughness: 0.85 });
  const matHoof = new THREE.MeshStandardMaterial({ color: lin(0x2f2721), roughness: 0.55 });
  const matDark = new THREE.MeshStandardMaterial({ color: lin(0x2b1d14), roughness: 0.95 });
  const matMane = new THREE.MeshStandardMaterial({ color: lin(0x6d3a1b), roughness: 1 });
  const matEye = new THREE.MeshStandardMaterial({ color: lin(0x120c09), roughness: 0.2 });

  /* ---------- giraffe body (root +Z is forward) ---------- */
  const giraffe = new THREE.Group();
  giraffe.rotation.order = 'YXZ';
  scene.add(giraffe);
  const body = new THREE.Group();
  const BODY_Y = 2.55, BODY_PITCH = -0.12;
  body.position.set(0, BODY_Y, 0);
  body.rotation.x = BODY_PITCH;
  giraffe.add(body);

  const patterned = [];
  function addMesh(parent, geo, mat, ref) {
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    if (ref) patterned.push([mesh, ref]);
    return mesh;
  }
  function latheAlongZ(profile, segs, deform) {

    const G = giraffe.position;
    desired.set(G.x + Math.sin(ang) * dist, G.y + rise + view.lift * dist * 0.55, G.z + Math.cos(ang) * dist);
    for (const o of obstacles) {
      const dx = desired.x - o[0], dz = desired.z - o[1], d = Math.hypot(dx, dz);
      if (d < o[2]) { const k = o[2] / Math.max(d, 0.001); desired.x = o[0] + dx * k; desired.z = o[1] + dz * k; }
    }
    desired.y = Math.max(desired.y, terrainH(desired.x, desired.z) + 1.1);
    lookT.set(G.x + fwd.x * 0.7, G.y + 2.75 - view.lift * 0.6, G.z + fwd.z * 0.7);
    if (!camReady) { camPos.copy(desired); camLook.copy(lookT); camReady = true; }
    camPos.lerp(desired, 1 - Math.exp(-dt * 2.6));
    camLook.lerp(lookT, 1 - Math.exp(-dt * 3.2));
    camera.position.copy(camPos);
    camera.lookAt(camLook);
    skyGroup.position.copy(camPos);
  }

  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused) {
      simT += dt;
      phase = wrap01(phase + dt / GAIT.T);
      travel += SPEED * dt;
      grassTime.value = simT;
    }
    const yaw = placeGiraffe();
    updateGiraffe(phase);
    updateNeckHead(simT, phase);
    updateDetails(simT);
    updateBirds(simT);
    updateCamera(dt, yaw);
    updateSun(giraffe.position);
    updateMotes(paused ? 0 : dt);
    renderer.render(scene, camera);
  }

  function dismissHint() { hintEl.classList.add('gone'); }
  function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Play' : 'Pause';
  }
  pauseBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', () => { view.yaw = 0; view.lift = 0; view.zoom = 1; });

  const pointers = new Map();
  let pinchStart = 0, zoomStart = 1;
  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('dragging');
    if (pointers.size === 2) {
      const [p1, p2] = [...pointers.values()];
      pinchStart = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      zoomStart = view.zoom;
    }
    dismissHint();
  });
  canvas.addEventListener('pointermove', (e) => {
    const pt = pointers.get(e.pointerId);
    if (!pt) return;
    const dx = e.clientX - pt.x, dy = e.clientY - pt.y;
    pt.x = e.clientX;
    pt.y = e.clientY;
    if (pointers.size === 1) {
      view.yaw -= dx * 0.006;
      view.lift = clamp(view.lift + dy * 0.003, -0.15, 1.1);
    } else if (pointers.size === 2 && pinchStart > 0) {
      const [p1, p2] = [...pointers.values()];
      const now = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      view.zoom = clamp(zoomStart * (pinchStart / Math.max(now, 1)), 0.55, 1.8);
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = 0;
    if (pointers.size === 0) canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    view.zoom = clamp(view.zoom * Math.exp(e.deltaY * 0.0012), 0.55, 1.8);
    dismissHint();
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLButtonElement) return;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); togglePause(); }
    else if (k === 'ArrowLeft') view.yaw += 0.12;
    else if (k === 'ArrowRight') view.yaw -= 0.12;
    else if (k === 'ArrowUp') view.lift = clamp(view.lift + 0.08, -0.15, 1.1);
    else if (k === 'ArrowDown') view.lift = clamp(view.lift - 0.08, -0.15, 1.1);
    else if (k === '+' || k === '=') view.zoom = clamp(view.zoom * 0.9, 0.55, 1.8);
    else if (k === '-' || k === '_') view.zoom = clamp(view.zoom * 1.1, 0.55, 1.8);
    else return;
    dismissHint();
  });
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    showProblem('The graphics context was lost. Reload the page to restart the scene.');
  });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    const aspect = w / Math.max(h, 1);
    renderer.setSize(w, h);
    camera.aspect = aspect;
    camera.fov = aspect < 1 ? 40 + 22 * (1 - aspect) : 40;
    portraitDist = aspect < 1 ? 1 + 0.5 * (1 - aspect) : 1;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
