<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Giraffe Walking through Savannah - Three.js</title>
<style>
  body { margin:0; overflow:hidden; background:#87ceeb; }
  canvas { display:block; }
  #info {
    position:absolute; top:10px; left:10px; color:#fff; font-family:system-ui;
    background:rgba(0,0,0,0.4); padding:8px 12px; border-radius:8px;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">Giraffe Savannah • drag to orbit</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xBFDFFF);
scene.fog = new THREE.Fog(0xBFDFFF, 60, 200);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(6, 5, 12);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0,2.5,0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1);
sun.position.set(10, 18, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  new THREE.MeshStandardMaterial({ color:0xd2b48c, roughness:1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Simple trees
function makeTree(x,z){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2,0.3,3,8),
    new THREE.MeshStandardMaterial({ color:0x8B5A2B })
  );
  trunk.position.y = 1.5;
  trunk.castShadow = true;
  const crown = new THREE.Mesh(
    new THREE.ConeGeometry(1.3,3,8),
    new THREE.MeshStandardMaterial({ color:0x4a7c2e })
  );
  crown.position.y = 3.5;
  crown.castShadow = true;
  g.add(trunk,crown);
  g.position.set(x,0,z);
  scene.add(g);
}
for(let i=0;i<60;i++){
  makeTree((Math.random()-0.5)*200, (Math.random()-0.5)*200);
}

// Giraffe
const giraffeMat = new THREE.MeshStandardMaterial({ color:0xF5E1C8, roughness:0.8 });
const spotMat = new THREE.MeshStandardMaterial({ color:0x8B5A2B });

const giraffe = new THREE.Group();
scene.add(giraffe);
giraffe.position.set(0,0,0);

const torso = new THREE.Group();
giraffe.add(torso);
torso.position.y = 2.2;

const body = new THREE.Mesh(new THREE.BoxGeometry(1.2,1.0,2.0), giraffeMat);
body.position.y = 0.5;
body.castShadow = true;
torso.add(body);

// Neck + head
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.3,3.2,8), giraffeMat);
neck.position.y = 2.8;
neck.castShadow = true;
torso.add(neck);

const head = new THREE.Group();
head.position.y = 3.2;
neck.add(head);
const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.6,0.8), giraffeMat);
headMesh.castShadow = true;
head.add(headMesh);
const horn = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.4,6), giraffeMat);
horn.position.set(0.1,0.3,0.3);
head.add(horn);

// Legs
function makeLeg(x,z){
  const leg = new THREE.Group();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.16,1.6,8), giraffeMat);
  mesh.position.y = -0.8;
  mesh.castShadow = true;
  leg.add(mesh);
  leg.position.set(x, 1.1, z);
  torso.add(leg);
  return leg;
}
const leftFront = makeLeg(-0.4, 0.6);
const rightFront = makeLeg(0.4, 0.6);
const leftBack  = makeLeg(-0.4, -0.6);
const rightBack = makeLeg(0.4, -0.6);

// Simple spots
for(let i=0;i<25;i++){
  const s = new THREE.Mesh(new THREE.CircleGeometry(0.08+Math.random()*0.07,12), spotMat);
  s.position.set((Math.random()-0.5)*1.0, Math.random()*1.0, (Math.random()-0.5)*1.8);
  s.lookAt(body.position);
  body.add(s);
}

// Animation
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();

  // walk forward
  giraffe.position.z -= 0.04;
  if (giraffe.position.z < -90) giraffe.position.z = 90;

  // bobbing
  giraffe.position.y = Math.sin(t*6)*0.06;

  // leg swing
  const swing = Math.sin(t*6)*0.5;
  leftFront.rotation.x = swing;
  rightFront.rotation.x = -swing;
  leftBack.rotation.x = -swing;
  rightBack.rotation.x = swing;

  // neck sway
  neck.rotation.z = Math.sin(t*0.8)*0.07;

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
