<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giraffe in the Savannah (Three.js)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; /* Sky Blue */ }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // --- SCENE SETUP ---
    let scene, camera, renderer;
    let giraffe;
    let clock = new THREE.Clock();

    function init() {
        // 1. Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky color

        // 2. Camera
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 15); // Position camera back and slightly elevated

        // 3. Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Enable shadows
        document.body.appendChild(renderer.domElement);

        // --- ENVIRONMENT: SAVANNAH ---
        // Ground Plane
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 }); // Earthy brown
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Distant Trees (Simple placeholders)
        const treeGeometry = new THREE.BoxGeometry(1, 5, 1);
        const treeMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 }); // Forest green
        for (let i = 0; i < 15; i++) {
            const tree = new THREE.Mesh(treeGeometry, treeMaterial);
            tree.position.set(Math.random() * 60 - 30, 2.5, Math.random() * 60 - 30);
            tree.castShadow = true;
            scene.add(tree);
        }


        // --- OBJECT: GIRAFFE (Simplified) ---
        // Giraffe body (cylinder)
        const bodyGeometry = new THREE.CylinderGeometry(1, 1.5, 8, 8);
        const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0xD2B48C }); // Tan/Khaki
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = 4; 
        body.castShadow = true;

        // Giraffe neck (cylinder)
        const neckGeometry = new THREE.CylinderGeometry(0.7, 0.7, 5, 8);
        const neck = new THREE.Mesh(neckGeometry, bodyMaterial);
        neck.position.set(0, 8, 0); // Position above the body
        neck.castShadow = true;

        // Group the giraffe parts for easy movement
        giraffe = new THREE.Group();
        giraffe.add(body);
        giraffe.add(neck);
        
        // Start position
        giraffe.position.set(0, 0, 0); 
        scene.add(giraffe);


        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0x666666); // Soft overall light
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(20, 30, 10);
        directionalLight.castShadow = true;
        // Configure shadow properties
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.near = 0.1;
        directionalLight.shadow.camera.far = 100;
        scene.add(directionalLight);

        // Handle window resizing
        window.addEventListener('resize', onWindowResize, false);
    }

    // --- ANIMATION LOGIC ---
    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        
        // 1. WALKING MOVEMENT
        // Move the giraffe forward along the Z-axis
        giraffe.position.z -= 0.5 * delta; 

        // Simple looping: if it goes off screen, reset it
        if (giraffe.position.z < -50) {
            giraffe.position.z = 50;
        }

        // 2. WALKING ANIMATION (Rotation)
        // Rotate the entire group slightly to simulate gait
        // Note: In a real scenario, you'd animate individual leg/neck parts.
        giraffe.rotation.y += 0.5 * delta; 

        // 3. RENDER
        renderer.render(scene, camera);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Initialize and start
    init();
    animate();

</script>
</body>
</html>
