<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giraffe at Golden Hour</title>
<style>
  :root {
    --page-bg: #f1c795;
    --hud-bg: rgba(38, 26, 14, 0.52);
    --hud-fg: #fff4e2;
    --hud-dim: rgba(255, 244, 226, 0.78);
    --hud-line: rgba(255, 244, 226, 0.24);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #1d1710;
      --hud-bg: rgba(12, 9, 6, 0.62);
      --hud-fg: #f7ead3;
      --hud-dim: rgba(247, 234, 211, 0.74);
      --hud-line: rgba(247, 234, 211, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #1d1710;
    --hud-bg: rgba(12, 9, 6, 0.62);
    --hud-fg: #f7ead3;
    --hud-dim: rgba(247, 234, 211, 0.74);
    --hud-line: rgba(247, 234, 211, 0.2);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page-bg);
    overflow: hidden;
    color: var(--hud-fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab; outline: none;
  }
  #stage.dragging { cursor: grabbing; }
  .hud-top {
    position: fixed; top: 0; left: 0;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0;
    pointer-events: none;
  }
  .hud-bottom {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: center;
    padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--hud-bg); color: var(--hud-fg);
    border: 1px solid var(--hud-line);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    pointer-events: auto; max-width: 100%;
  }
  .pill strong { font-weight: 650; letter-spacing: 0.01em; }
  .pill span { color: var(--hud-dim); font-size: 13px; }
  .pill button {
    font: inherit; font-weight: 600; color: var(--hud-fg);
    background: transparent; border: 1px solid var(--hud-line);
    border-radius: 999px; padding: 4px 12px; cursor: pointer;
  }
  .pill button:hover { background: var(--hud-line); }
  .pill button:focus-visible { outline: 2px solid var(--hud-fg); outline-offset: 2px; }
  @media (max-width: 520px) { .pill .hint { display: none; } }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="A giraffe walking through the savannah at golden hour"></canvas>
<div class="hud-top"><div class="pill"><strong>Giraffe stroll</strong><span>golden hour &middot; Three.js</span></div></div>
<div class="hud-bottom"><div class="pill"><button id="pause" type="button">Pause</button><span class="hint">Drag to look around &middot; scroll or pinch to zoom</span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  function fail(msg) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:16px/1.5 system-ui,sans-serif;color:#2b1d10;';
    d.textContent = msg;
    document.body.appendChild(d);
  }
  if (!window.THREE) { fail('Three.js could not be loaded, so the giraffe stayed home.'); return; }
  var THREE = window.THREE;
  var stage = document.getElementById('stage');
  var renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: stage, antialias: true }); }
  catch (e) { fail('This browser could not start WebGL, so the giraffe stayed home.'); return; }

  /* ---------- helpers ---------- */
  var TAU = Math.PI * 2;
  var clamp = function (x, a, b) { return Math.min(b, Math.max(a, x)); };
  var smoothstep = function (a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rand = mulberry32(20261023);
  var rr = function (a, b) { return a + (b - a) * rand(); };
  var lin = function (hex) { return new THREE.Color(hex).convertSRGBToLinear(); };

  /* ---------- renderer / scene ---------- */
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  var FOG_HEX = 0xf1c795;
  var scene = new THREE.Scene();
  scene.fog = new THREE.Fog(FOG_HEX, 50, 250);
  var camera = new THREE.PerspectiveCamera(38, 1, 0.5, 1600);

  /* ---------- light ---------- */
  var SUN_DIR = new THREE.Vector3(0.62, 0.40, 0.68).normalize();
  var SUN_ELEV = Math.asin(SUN_DIR.y);
  var SHADOW_DIR = new THREE.Vector2(-SUN_DIR.x, -SUN_DIR.z).normalize();

  scene.add(new THREE.HemisphereLight(0xcfe0ff, 0xc9a165, 0.62));
  var sun = new THREE.DirectionalLight(0xffd29a, 2.0);
  sun.position.copy(SUN_DIR).multiplyScalar(60);
  sun.target.position.set(0, 2, 0);
  scene.add(sun); scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
  sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
  sun.shadow.camera.near = 20; sun.shadow.camera.far = 110;
  sun.shadow.camera.updateProjectionMatrix();
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.04;
  sun.shadow.radius = 2.5;
  var fill = new THREE.DirectionalLight(0xaec4ff, 0.3);
  fill.position.set(-0.6, 0.35, -0.5);
  scene.add(fill);

  /* ---------- sky dome ---------- */
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uTop: { value: new THREE.Color(0x4f7fc4) },
      uMid: { value: new THREE.Color(0xd9c3c1) },
      uHor: { value: new THREE.Color(FOG_HEX) },
      uSun: { value: SUN_DIR.clone() }
    },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      'uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHor; uniform vec3 uSun;',
      'varying vec3 vDir;',
      'void main(){',
      '  vec3 d = normalize(vDir);',
      '  float h = max(d.y, 0.0);',
      '  vec3 col = mix(uHor, uMid, smoothstep(0.0, 0.28, h));',
      '  col = mix(col, uTop, smoothstep(0.18, 0.9, h));',
      '  float s = max(dot(d, normalize(uSun)), 0.0);',
      '  col += vec3(1.0, 0.72, 0.42) * (0.30 * pow(s, 5.0) + 0.45 * pow(s, 40.0));',
      '  col = mix(col, vec3(1.0, 0.95, 0.82), smoothstep(0.9990, 0.9996, s));',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n')
  });
  var sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat);
  sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);

  /* ---------- procedural textures ---------- */
  function makeCanvas(size) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    return cv;
  }
  function toTexture(cv) {
    var t = new THREE.CanvasTexture(cv);
    t.encoding = THREE.sRGBEncoding;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = maxAniso;
    return t;
  }

  // Tileable, domain-warped Voronoi: cream network + brown patches.
  function makeGiraffeTexture(o) {
    var size = 512, cells = o.cells, rng = mulberry32(o.seed);
    var line = o.line, patches = o.patches, warp = o.warp, edge = o.edge, fade = o.fade || 0;
    var pts = [];
    for (var j = 0; j < cells; j++) for (var i = 0; i < cells; i++) {
      pts.push({ x: i + 0.2 + 0.6 * rng(), y: j + 0.2 + 0.6 * rng(), c: patches[Math.floor(rng() * patches.length)], k: 0.82 + 0.36 * rng() });
    }
    var cv = makeCanvas(size), ctx = cv.getContext('2d');
    var img = ctx.createImageData(size, size), d = img.data;
    var amp = warp / cells;
    for (var py = 0; py < size; py++) {
      var fy = py / size;
      for (var px = 0; px < size; px++) {
        var fx = px / size;
        var wx = fx + amp * (0.6 * Math.sin(TAU * (2 * fy) + 1.3) + 0.4 * Math.sin(TAU * (3 * fx + fy) + 0.4) + 0.22 * Math.sin(TAU * (5 * fx - 4 * fy) + 0.9));
        var wy = fy + amp * (0.6 * Math.sin(TAU * (2 * fx) + 2.1) + 0.4 * Math.sin(TAU * (fx + 3 * fy) + 5.1) + 0.22 * Math.sin(TAU * (4 * fx + 5 * fy) + 2.2));
        var gx = wx * cells, gy = wy * cells;
        var ci = Math.floor(gx), cj = Math.floor(gy);
        var d1 = 9, d2 = 9, n1 = null;
        for (var dj = -1; dj <= 1; dj++) {
          for (var di = -1; di <= 1; di++) {
            var ni = (((ci + di) % cells) + cells) % cells;
            var nj = (((cj + dj) % cells) + cells) % cells;
            var p = pts[nj * cells + ni];
            var ex = (ci + di) + (p.x - ni) - gx;
            var ey = (cj + dj) + (p.y - nj) - gy;
            var dd = ex * ex + ey * ey;
            if (dd < d1) { d2 = d1; d1 = dd; n1 = p; } else if (dd < d2) { d2 = dd; }
          }
        }
        var s1 = Math.sqrt(d1), F = Math.sqrt(d2) - s1;
        var t = smoothstep(edge * 0.55, edge * 1.35, F);
        var center = Math.min(1, s1 / 0.55);
        var dk = (1 - 0.18 * (1 - center)) * n1.k;
        var r = n1.c[0] * dk, g = n1.c[1] * dk, b = n1.c[2] * dk;
        r += (line[0] - r) * fade; g += (line[1] - g) * fade; b += (line[2] - b) * fade;
        r = line[0] + (r - line[0]) * t; g = line[1] + (g - line[1]) * t; b = line[2] + (b - line[2]) * t;
        var grain = (Math.random() - 0.5) * 9;
        var idx = (py * size + px) * 4;
        d[idx] = clamp(r + grain, 0, 255); d[idx + 1] = clamp(g + grain, 0, 255); d[idx + 2] = clamp(b + grain, 0, 255); d[idx + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return toTexture(cv);
  }

  // Tileable dry-grass ground.
  function makeGroundTexture() {
    var size = 512, cv = makeCanvas(size), ctx = cv.getContext('2d');
    var img = ctx.createImageData(size, size), d = img.data;
    var oct = [4, 8, 16, 96].map(function (f, i) {
      var rng = mulberry32(900 + i), a = new Float32Array(f * f);
      for (var k = 0; k < a.length; k++) a[k] = rng();
      return { f: f, a: a };
    });
    function vn(o, x, y) {
      var f = o.f, gx = x * f, gy = y * f, ix = Math.floor(gx), iy = Math.floor(gy);
      var fx = gx - ix, fy = gy - iy, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      var i0 = ix % f, i1 = (ix + 1) % f, j0 = iy % f, j1 = (iy + 1) % f;
      var a = o.a[j0 * f + i0], b = o.a[j0 * f + i1], c = o.a[j1 * f + i0], e = o.a[j1 * f + i1];
      var top = a + (b - a) * sx, bot = c + (e - c) * sx;
      return top + (bot - top) * sy;
    }
    var dark = [150, 120, 62], light = [216, 186, 114], olive = [138, 136, 72], soil = [170, 124, 82];
    function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

      for (var px = 0; px < size; px++) {
        var x = px / size, y = py / size;
        var n = 0.55 * vn(oct[0], x, y) + 0.3 * vn(oct[1], x, y) + 0.15 * vn(oct[2], x, y);
        var m = vn(oct[1], x + 0.37, y + 0.71);
        var s = vn(oct[0], x + 0.12, y + 0.43);
        var g = vn(oct[3], x, y);
        var col = mix(dark, light, smoothstep(0.25, 0.75, n));
        col = mix(col, olive, smoothstep(0.58, 0.8, m) * 0.55);
        col = mix(col, soil, smoothstep(0.62, 0.85, s) * 0.6);
        var k = 0.9 + 0.2 * g, idx = (py * size + px) * 4;
        d[idx] = col[0] * k; d[idx + 1] = col[1] * k; d[idx + 2] = col[2] * k; d[idx + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    var sr = mulberry32(31);
    var cols = ['rgba(238,216,152,0.30)', 'rgba(108,84,40,0.26)', 'rgba(132,142,72,0.20)', 'rgba(200,170,104,0.28)'];
    ctx.lineWidth = 1.1; ctx.lineCap = 'round';
    for (var n2 = 0; n2 < 5200; n2++) {
      var x0 = sr() * size, y0 = sr() * size, a = sr() * TAU, len = 5 + sr() * 11;
      var dx = Math.cos(a) * len, dy = Math.sin(a) * len;
      ctx.strokeStyle = cols[Math.floor(sr() * cols.length)];
      for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++) {
        var X = x0 + ox * size, Y = y0 + oy * size;
        if (X < -20 || X > size + 20 || Y < -20 || Y > size + 20) continue;
        ctx.beginPath(); ctx.moveTo(X, Y); ctx.lineTo(X + dx, Y + dy); ctx.stroke();
      }
    }
    return toTexture(cv);
  }

  // Large soft blotches that break up the ground's tiling.
  function makeMacroTexture() {
    var size = 512, cv = makeCanvas(size), ctx = cv.getContext('2d'), rng = mulberry32(77);
    var pal = ['120,92,44', '118,124,62', '232,206,140', '172,114,74', '96,78,40'];
    for (var i = 0; i < 54; i++) {
      var x = rng() * size, y = rng() * size, r = 40 + rng() * 90, rgb = pal[Math.floor(rng() * pal.length)], a = 0.14 + rng() * 0.2;
      for (var ox = -1; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++) {
        var X = x + ox * size, Y = y + oy * size;
        var g = ctx.createRadialGradient(X, Y, 0, X, Y, r);
        g.addColorStop(0, 'rgba(' + rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + rgb + ',0)');
        ctx.fillStyle = g; ctx.fillRect(X - r, Y - r, r * 2, r * 2);
      }
    }
    return toTexture(cv);
  }

  function softBlobTexture(rgb, alpha, stops) {
    var cv = makeCanvas(128), ctx = cv.getContext('2d');
    var g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], 'rgba(' + rgb + ',' + (alpha * stops[i][1]) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);
    var t = new THREE.CanvasTexture(cv);
    t.encoding = THREE.sRGBEncoding;
    return t;
  }

  /* ---------- ground ---------- */
  var GROUND_SIZE = 1400, GROUND_TILE = 14, MACRO_TILE = 70;
  var groundTex = makeGroundTexture();
  groundTex.repeat.set(GROUND_SIZE / GROUND_TILE, GROUND_SIZE / GROUND_TILE);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE), new THREE.MeshLambertMaterial({ map: groundTex }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
  scene.add(ground);
  var macroTex = makeMacroTexture();
  macroTex.repeat.set(GROUND_SIZE / MACRO_TILE, GROUND_SIZE / MACRO_TILE);
  var macro = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE), new THREE.MeshLambertMaterial({
    map: macroTex, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
  }));
  macro.rotation.x = -Math.PI / 2; macro.position.y = 0.03; macro.receiveShadow = true;
  scene.add(macro);

  /* ---------- wind-swept grass tufts (instanced) ---------- */
  var grassTime = { value: 0 };
  var grassMat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  grassMat.onBeforeCompile = function (shader) {
    shader.uniforms.uTime = grassTime;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;')
      .replace('#include <begin_vertex>', [
        '#include <begin_vertex>',
        'float wph = instanceMatrix[3].x * 0.23 + instanceMatrix[3].z * 0.17;',
        'float swy = sin(uTime * 1.6 + wph) * 0.5 + sin(uTime * 2.7 + wph * 1.7) * 0.25;',
        'transformed.x += swy * 0.12 * position.y * position.y;',
        'transformed.z += cos(uTime * 1.3 + wph) * 0.06 * position.y * position.y;'
      ].join('\n'));
  };
  function makeTuft(seed, cBase, cTip) {
    var rng = mulberry32(seed), pos = [], col = [];
    function v(p, c) { pos.push(p[0], p[1], p[2]); col.push(c.r, c.g, c.b); }
    for (var b = 0; b < 6; b++) {
      var ang = rng() * TAU, rad = rng() * 0.16;
      var bx = Math.cos(ang) * rad, bz = Math.sin(ang) * rad;
      var h = 0.55 + rng() * 0.5, lean = rng() * TAU, bend = 0.12 + rng() * 0.28;
      var lx = Math.cos(lean), lz = Math.sin(lean), w = 0.022 + rng() * 0.014;
      var px = -lz, pz = lx, mh = h * 0.55, ml = bend * 0.35 * h;
      var k = 0.8 + 0.4 * rng();
      var c0 = cBase.clone().multiplyScalar(k), c1 = cBase.clone().lerp(cTip, 0.55).multiplyScalar(k), c2 = cTip.clone().multiplyScalar(0.9 + 0.2 * rng());
      var b0 = [bx - px * w, 0, bz - pz * w], b1 = [bx + px * w, 0, bz + pz * w];
      var m0 = [bx - px * w * 0.75 + lx * ml, mh, bz - pz * w * 0.75 + lz * ml];
      var m1 = [bx + px * w * 0.75 + lx * ml, mh, bz + pz * w * 0.75 + lz * ml];
      var tp = [bx + lx * bend * h, h, bz + lz * bend * h];
      v(b0, c0); v(b1, c0); v(m0, c1);
      v(b1, c0); v(m1, c1); v(m0, c1);
      v(m0, c1); v(m1, c1); v(tp, c2);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.computeVertexNormals();
    return g;
  }
  var grassFields = [];
  function addGrass(geo, count, span, zA, zB) {
    var mesh = new THREE.InstancedMesh(geo, grassMat, count);
    var a = mesh.instanceMatrix.array;
    for (var i = 0; i < count; i++) {
      var x = rr(-span / 2, span / 2), z = rr(zA, zB);
      var s = rr(0.6, 1.35);
      if (z > -1 && z < 7) s *= 0.7;
      var ry = rr(0, TAU), c = Math.cos(ry) * s, sn = Math.sin(ry) * s, o = i * 16;
      a[o] = c; a[o + 1] = 0; a[o + 2] = -sn; a[o + 3] = 0;
      a[o + 4] = 0; a[o + 5] = s; a[o + 6] = 0; a[o + 7] = 0;
      a[o + 8] = sn; a[o + 9] = 0; a[o + 10] = c; a[o + 11] = 0;
      a[o + 12] = x; a[o + 13] = 0; a[o + 14] = z; a[o + 15] = 1;
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false; mesh.receiveShadow = true;
    scene.add(mesh);
    grassFields.push({ mesh: mesh, span: span });
  }
  var gGold = makeTuft(11, lin(0x8a7335), lin(0xe3c77a));
  var gPale = makeTuft(23, lin(0x9a8444), lin(0xf0dca0));
  var gOlive = makeTuft(37, lin(0x6c7436), lin(0xb7b768));
  addGrass(gGold, 4000, 120, -14, 20);
  addGrass(gPale, 2500, 120, -14, 20);
  addGrass(gGold, 3500, 220, -70, -14);
  addGrass(gOlive, 1500, 220, -70, -14);

  /* ---------- scenery: acacias, rocks, bushes ---------- */
  var HALF = 160, scenery = [];
  function mergeParts(parts) {
    var P = [], N = [], C = [], m = new THREE.Matrix4();
    parts.forEach(function (it) {
      var g = it.geo.index ? it.geo.toNonIndexed() : it.geo.clone();
      m.compose(it.pos, it.quat, it.scale);
      g.applyMatrix4(m);
      var p = g.attributes.position.array, n = g.attributes.normal.array, i;

    var eg = ellipsoid(0.045, 0.12, 0.022, 12, 8); eg.translate(0, 0.1, 0);
    addMesh(eg, headMat, pivot);
    ears.push({ g: pivot, s: s });
  });
  [1, -1].forEach(function (s) {
    var pivot = new THREE.Group(); pivot.position.set(0.02, 0.15, s * 0.075);
    pivot.rotation.set(s * 0.14, 0, 0.28); head.add(pivot);
    var sg = new THREE.CylinderGeometry(0.022, 0.03, 0.22, 8, 1); sg.translate(0, 0.11, 0);
    addMesh(sg, headMat, pivot);
    addMesh(ellipsoid(0.046, 0.046, 0.046, 10, 8), darkMat, pivot).position.y = 0.235;
    addMesh(new THREE.ConeGeometry(0.036, 0.07, 7), tuftMat, pivot).position.y = 0.3;
  });
  addMesh(new THREE.ConeGeometry(0.035, 0.07, 8), headMat, head).position.set(0.2, 0.165, 0);

  // tail ----------------------------------------------------------------
  var tail1 = new THREE.Group(); tail1.position.set(-1.14, 0.12, 0); torso.add(tail1);
  var tail2 = new THREE.Group(); tail2.position.y = -0.6; tail1.add(tail2);
  (function () {
    var a = new THREE.CylinderGeometry(0.045, 0.03, 0.6, 8, 1); a.translate(0, -0.3, 0);
    addMesh(a, headMat, tail1);
    var b = new THREE.CylinderGeometry(0.03, 0.018, 0.5, 8, 1); b.translate(0, -0.25, 0);
    addMesh(b, headMat, tail2);
    addMesh(ellipsoid(0.055, 0.17, 0.055, 10, 8), tuftMat, tail2).position.y = -0.58;
  })();

  /* =====================================================================
     ANIMATION
     ===================================================================== */
  var CYCLE_T = 1.7, BETA = 0.62, STRIDE = 1.3, LIFT = 0.3;
  var SPEED = STRIDE / (BETA * CYCLE_T);           // ground speed that keeps planted hooves from sliding
  var BOB = 0.05, ROLL = 0.035, SHIFT = 0.05;
  var cycle = 0;
  var ft = { x: 0, y: 0, sw: 0 };

  // Foot path in the body frame: planted feet slide back at exactly ground speed,
  // swinging feet follow a Hermite curve with matched velocity and a soft lift.
  function footTarget(u) {
    if (u < BETA) {
      ft.x = STRIDE / 2 - STRIDE * (u / BETA); ft.y = 0; ft.sw = 0;
      return;
    }
    var s = (u - BETA) / (1 - BETA), s2 = s * s, s3 = s2 * s;
    var m = -STRIDE * (1 - BETA) / BETA;
    ft.x = (2 * s3 - 3 * s2 + 1) * (-STRIDE / 2) + (s3 - 2 * s2 + s) * m + (-2 * s3 + 3 * s2) * (STRIDE / 2) + (s3 - s2) * m;
    ft.y = LIFT * (0.5 - 0.5 * Math.cos(TAU * s));
    ft.sw = Math.sin(Math.PI * s);
  }

  // Two-bone IK in the leg's plane. Front knees bump forward, hind hocks bump back.
  function solveLeg(leg, tx, ty) {
    var L1 = leg.L1, L2 = leg.L2, d = Math.sqrt(tx * tx + ty * ty);
    var maxD = (L1 + L2) * 0.9995, minD = Math.abs(L1 - L2) + 0.05;
    if (d > maxD) { tx *= maxD / d; ty *= maxD / d; d = maxD; }
    else if (d < minD) { tx *= minD / d; ty *= minD / d; d = minD; }
    var phiT = Math.atan2(tx, -ty);
    var a = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    var th1 = phiT + (leg.front ? a : -a);
    var kx = L1 * Math.sin(th1), ky = -L1 * Math.cos(th1);
    var th2 = Math.atan2(tx - kx, -(ty - ky));
    leg.root.rotation.z = th1;
    leg.lower.rotation.z = th2 - th1;
    return th2;
  }

  function updateGiraffe(dt, t) {
    cycle += dt / CYCLE_T;
    var c = cycle, ph = TAU * (c - 0.37);
    gait.position.y = BOB * Math.cos(2 * ph);
    swayG.rotation.x = -ROLL * Math.cos(ph);
    swayG.position.z = -SHIFT * Math.cos(ph);
    swayG.rotation.y = 0.03 * Math.sin(TAU * c + 0.8) + 0.02 * Math.sin(t * 0.37);
    torso.rotation.z = 0.11 + 0.012 * Math.sin(2 * TAU * c + 0.6);

    for (var i = 0; i < legs.length; i++) {
      var leg = legs[i];
      var u = (((c - leg.phase) % 1) + 1) % 1;
      footTarget(u);
      var th2 = solveLeg(leg, ft.x, ft.y - (gait.position.y + leg.py));
      leg.hoof.rotation.z = -th2 - 0.45 * ft.sw;
      if (leg.prevU > 0.8 && u < 0.2) emitDust(leg.px + ft.x, leg.z);
      leg.prevU = u;
    }

    var nph = TAU * c, amps = [0.02, 0.03, 0.04, 0.05];
    for (var n = 0; n < 4; n++) {
      neck[n].rotation.z = neckRest[n] + amps[n] * Math.sin(nph - 0.7 * n + 0.5);
      neck[n].rotation.x = 0.045 * Math.sin(t * 0.23 + 0.5 * n) + 0.012 * Math.sin(nph + n);
    }
    head.rotation.z = HEAD_REST + 0.05 * Math.sin(nph - 2.5);
    head.rotation.y = 0.35 * Math.sin(t * 0.23 + 0.9) * (0.6 + 0.4 * Math.sin(t * 0.071));

    tail1.rotation.z = -0.12 + 0.09 * Math.sin(nph + 0.6);
    tail1.rotation.x = 0.2 * Math.sin(nph * 0.5 + 1.0);
    tail2.rotation.z = 0.1 * Math.sin(nph - 0.5);
    tail2.rotation.x = 0.25 * Math.sin(nph * 0.5 + 0.4);

    ears[0].g.rotation.x = 1.1 + 0.22 * Math.max(0, Math.sin(t * 1.7)) * Math.max(0, Math.sin(t * 0.45));
    ears[1].g.rotation.x = -(1.1 + 0.22 * Math.max(0, Math.sin(t * 1.3 + 2)) * Math.max(0, Math.sin(t * 0.37 + 1)));
    var blink = (t % 4.3) < 0.14 ? 0.12 : 1;
    eyes[0].scale.y = eyes[1].scale.y = blink;
  }

  function updateWorld(dt, t) {
    var dx = SPEED * dt, i;
    groundTex.offset.x = (groundTex.offset.x + dx / GROUND_TILE) % 1;
    macroTex.offset.x = (macroTex.offset.x + dx / MACRO_TILE) % 1;
    grassTime.value = t;

    for (i = 0; i < grassFields.length; i++) {
      var f = grassFields[i], a = f.mesh.instanceMatrix.array, half = f.span / 2;
      for (var k = 12; k < a.length; k += 16) {
        var x = a[k] - dx;
        if (x < -half) x += f.span;
        a[k] = x;
      }
      f.mesh.instanceMatrix.needsUpdate = true;
    }
    for (i = 0; i < scenery.length; i++) {
      var it = scenery[i];
      it.g.position.x -= dx;
      if (it.g.position.x < -HALF) { it.g.position.x += HALF * 2; it.reroll(); }
    }
    for (i = 0; i < hillRings.length; i++) hillRings[i].mesh.rotation.y += dx / hillRings[i].R;
    cloudGroup.rotation.y += 0.0015 * dt;

    for (i = 0; i < birds.length; i++) {
      var b = birds[i];
      b.g.position.x += b.v * dt - dx;
      if (b.g.position.x > 90) { b.g.position.x -= 180; b.g.position.y = rr(14, 32); b.g.position.z = rr(-95, -35); }
      var s = Math.sin(t * b.f * 1.6 + b.ph);
      b.pr.rotation.x = -(0.15 + 0.7 * s);
      b.pl.rotation.x = 0.15 + 0.7 * s;
      b.g.position.y += Math.sin(t * 0.8 + b.ph) * 0.004;
    }
    for (i = 0; i < dust.length; i++) {
      var p = dust[i];
      if (!p.s.visible) continue;
      p.life += dt;
      var q = p.life / p.max;
      if (q >= 1) { p.s.visible = false; continue; }
      p.s.position.x += p.vx * dt - dx; p.s.position.y += p.vy * dt; p.s.position.z += p.vz * dt;
      p.vy *= 0.985; p.vx *= 0.98;
      var sc = p.s0 + (p.s1 - p.s0) * Math.sqrt(q);
      p.s.scale.set(sc, sc, 1);
      p.s.material.opacity = 0.42 * (1 - q) * Math.min(1, q * 8);
    }
  }

  /* =====================================================================
     CAMERA, INPUT, LOOP
     ===================================================================== */
  var camTarget = new THREE.Vector3(0.5, 2.85, 0);
  var userAz = 0, userEl = 0, userZoom = 1, autoBlend = 1, idle = 99, baseDist = 13;

  function updateCamera(rt, dt) {
    idle += dt;
    var want = idle > 5 ? 1 : 0;
    autoBlend += (want - autoBlend) * Math.min(1, dt * (want ? 0.5 : 5));
    var az = userAz + autoBlend * (0.2 + 0.55 * Math.sin(rt * 0.06));
    var el = userEl + autoBlend * (0.06 + 0.06 * Math.sin(rt * 0.09 + 1));
    var dist = baseDist * userZoom * (1 + autoBlend * 0.08 * Math.sin(rt * 0.05 + 2));
    var ce = Math.cos(el);
    camera.position.set(
      camTarget.x + dist * Math.sin(az) * ce,
      Math.max(0.6, camTarget.y + dist * Math.sin(el)),
      camTarget.z + dist * Math.cos(az) * ce
    );
    camera.lookAt(camTarget);
    sky.position.copy(camera.position);
  }

  function onResize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    baseDist = Math.max(12.5, 10.5 / camera.aspect);
  }
  window.addEventListener('resize', onResize);
  onResize();

  var pointers = new Map(), lastPinch = 0;
  stage.addEventListener('pointerdown', function (e) {
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    lastPinch = 0; idle = 0;
    stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', function (e) {
    var p = pointers.get(e.pointerId);
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY; idle = 0;
    if (pointers.size === 1) {
      userAz -= dx * 0.005;
      userEl = clamp(userEl + dy * 0.004, -0.35, 0.95);
    } else if (pointers.size === 2) {
      var v = Array.from(pointers.values());
      var dd = Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
      if (lastPinch > 0 && dd > 0) userZoom = clamp(userZoom * lastPinch / dd, 0.45, 1.8);
      lastPinch = dd;
    }
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    lastPinch = 0;
    if (pointers.size === 0) stage.classList.remove('dragging');
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    userZoom = clamp(userZoom * Math.exp(e.deltaY * 0.001), 0.45, 1.8);
    idle = 0;
  }, { passive: false });

  var paused = false, pauseBtn = document.getElementById('pause');
  function togglePause() { paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause'; }
  pauseBtn.addEventListener('click', togglePause);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); togglePause(); }
  });

  var last = 0, simT = 0, realT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    realT += dt;
    if (!paused) { simT += dt; updateGiraffe(dt, simT); updateWorld(dt, simT); }
    updateCamera(realT, dt);
    renderer.render(scene, camera);
  }
  updateGiraffe(0, 0);
  updateWorld(0, 0);
  requestAnimationFrame(function (now) { last = now; frame(now); });
})();
</script>
</body>
</html>
